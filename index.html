<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet Pêche JP · V6.5.12 UX carte</title>
<meta name="theme-color" content="#0F1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1720; --surface:#172233; --surface-2:#1E2C40;
    /* V6.5.23 — palette turquoise. L'accent est un TRIPLET : c'est ce qui permet aux
       teintes translucides d'en deriver au lieu d'etre reecrites en dur. Changer ces
       deux lignes repeint l'application entiere.
       #00AE74 est le turquoise le plus bleu qui tienne encore le plancher de separation
       de la courbe de maree (dE 15.2 en vision normale contre le gris de retrait). */
    --accent-rgb:0,174,116; --accent:rgb(var(--accent-rgb)); --accent-dim:#016E4A;
    --flag-rgb:232,154,168; --flag:rgb(var(--flag-rgb));
    --text:#EDEEF0; --text-muted:#8B97A8; --ok:#5FA87A;
    /* Couleur des libellés de section. L'ambre y était employé comme couleur de marque ;
       il est désormais réservé aux données et aux états actifs, où il reprend de la valeur
       parce qu'il devient rare. Un seul token : changer ici change partout. */
    --label:#D6DBE2;
    --border:rgba(var(--accent-rgb),0.16);
    /* V6.5.23 — escalier d'élévation. En sombre, une surface qui monte s'éclaircit ;
       elle ne s'inverse pas. --surface-3 est le palier des couches flottantes. */
    --surface-3:#26364E;
    /* Verre : teinte + arête supérieure spéculaire + ombre d'ancrage. */
    --glass-tint:rgba(23,34,51,.72);
    /* Remplissage des blocs en verre. Sous .55 le contenu du dessous transparaît trop et
       le texte devient illisible ; au-dessus de .70 le panneau redevient opaque et l'effet
       ne sert plus à rien. */
    --glass-panel:rgba(23,34,51,.46);
    --glass-panel-soft:rgba(30,44,64,.42);
    --glass-edge:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.22);
    --glass-lift:0 8px 32px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.24);
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* V6.5.23 — l'echelle typographique est en rem, ancree sur la taille de texte du
     navigateur : le reglage systeme de l'utilisateur agit enfin sur l'app. Plancher a
     11px (0.6875rem), le plancher dur de Dynamic Type — Caption 2 ne descend jamais
     plus bas. 126 declarations vivaient sous ce seuil. */
  html{font-size:100%;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', system-ui, sans-serif; min-height:100vh; overscroll-behavior-y:none;}

  /* V6.5.23 — nappe de couleur derrière le verre.
     Un backdrop-filter échantillonne les pixels du dessous : si ces pixels sont unis, on
     obtient un aplat flou, indiscernable d'un simple fond translucide. Il faut donc une
     variation tonale sous le verre pour qu'il se lise comme une matière. Nuages turquoise
     bleu et vert posés sur --bg, qui reste la teinte de base. Fixe : la nappe ne défile
     pas, les blocs glissent dessus.
     z-index:-1 pour rester dans la racine de superposition du document — un ancêtre avec
     transform, filter ou clip-path créerait une nouvelle racine et couperait le verre de
     la nappe. */
  body::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 62% 46% at 10% 4%,   rgba(34,190,214,.58) 0%, transparent 68%),
      radial-gradient(ellipse 54% 44% at 92% 15%,  rgba(46,216,176,.48) 0%, transparent 66%),
      radial-gradient(ellipse 52% 54% at 20% 56%,  rgba(38,152,200,.46) 0%, transparent 70%),
      radial-gradient(ellipse 56% 42% at 86% 74%,  rgba(42,208,172,.42) 0%, transparent 66%),
      radial-gradient(ellipse 60% 40% at 38% 100%, rgba(30,172,196,.38) 0%, transparent 70%),
      var(--bg);
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-optical-sizing:auto; letter-spacing:-0.01em;}
  button{font-family:inherit;}

  /* V6.5.23 — la barre est une couche de verre sous laquelle le contenu défile, pas une
     bande opaque. Le trait de 1px est remplacé par un dégradé d'arête : le skill proscrit
     les séparateurs durs sous une chrome flottante. */
  header{position:sticky; top:0; z-index:10; padding:calc(16px + var(--safe-top)) 16px 12px;
    background:var(--glass-tint); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%); box-shadow:var(--glass-edge);}
  header::after{content:''; position:absolute; left:0; right:0; bottom:-16px; height:16px;
    background:linear-gradient(180deg, rgba(15,23,32,.55), transparent); pointer-events:none;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--label); opacity:.72; margin:0 0 6px;}
  /* Fraunces change de dessin selon la taille (axe opsz 9..144). A 24px/600 il est trapu ;
     a 32px/500 avec un interlettrage negatif il devient editorial. Le skill : sur du grand
     texte le tracking se resserre, et l'emphase passe par la graisse, pas par la taille. */
  header h1{font-size:2rem; font-weight:500; letter-spacing:-0.02em; line-height:1.08; margin:0 0 4px;}
  header .sub{color:var(--text-muted); font-size:0.8125rem; margin:0;}
  /* V6.5.23 — en-tete de fiche espece : le nom domine, l'identite (japonais + latin)
     passe dessous en secondaire, et le bouton Focus s'ancre en haut a droite. */
  .back-row{display:flex; align-items:flex-start; gap:12px;}
  .sp-ident{flex:1 1 auto; min-width:0;}
  .sp-ident h1{font-size:1.75rem; font-weight:500; letter-spacing:-0.02em; line-height:1.1; margin:0;}
  /* Un binome latin se compose en italique, pas en capitales : en capitales espacees il
     debordait sur deux lignes et se lisait comme un libelle, pas comme un nom. */
  .sp-ident .eyebrow{margin:4px 0 0; opacity:.66; letter-spacing:.02em; text-transform:none;
    font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Meme modele de verre que les pastilles : degrade directionnel, arete speculaire,
     ombre interne, halo. Pas de backdrop-filter, la barre en porte deja un. */
  /* Les deux actions contextuelles de la fiche sont groupees en haut a droite.
     « Lecture » n'apparait que sur l'onglet Comprendre — setSpeciesTab bascule son
     attribut hidden par id, la logique existante fonctionne inchangee. */
  /* V6.5.23 — « Lecture » et « Focus » sont un seul et meme composant : meme verre, meme
     geometrie, meme encre au repos. Seul l'etat actif les colore, et il est identique pour
     les deux — Focus quand l'espece est suivie, Lecture quand le mode lecture est engage.
     Un bouton unique decrit deux fois etait la cause de leur divergence. */
  .sp-actions{flex:0 0 auto; display:flex; align-items:center; gap:8px; margin-top:2px;}
  .sp-actions>button{
    flex:0 0 auto; align-self:flex-start; appearance:none; cursor:pointer;
    border-radius:999px; padding:8px 12px; white-space:nowrap;
    font-family:'IBM Plex Mono',monospace; font-size:0.6875rem; line-height:1;
    color:#F2F5F8;
    background:linear-gradient(160deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.06) 42%, rgba(0,0,0,.22) 100%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -2px 4px rgba(0,0,0,.30),
               0 4px 12px rgba(0,0,0,.34), 0 0 0 1px rgba(var(--accent-rgb),.16);
    transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out),
               background .18s var(--ease-out), color .18s var(--ease-out);}

  /* Etat actif commun : le verre se teinte d'accent et l'encre s'inverse. */
  .sp-actions>button.on,
  body.reading-mode .sp-actions .reading-start{
    color:#0F1720;
    background:linear-gradient(160deg, rgba(255,255,255,.34) 0%, rgba(var(--accent-rgb),.92) 100%);
    border-color:rgba(255,255,255,.34);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 4px rgba(0,0,0,.22),
               0 4px 14px rgba(0,0,0,.36), 0 0 0 1px rgba(var(--accent-rgb),.5);}

  .sp-actions>button:active{transform:translateY(2px) scale(.96);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 1px 4px rgba(0,0,0,.4);}
  .back-btn{all:unset; cursor:pointer; color:var(--accent); font-size:1.25rem; line-height:1; padding:4px 6px 4px 0;}

  main{padding:16px 18px calc(40px + var(--safe-bottom));}
  /* V6.5.23 — le bouton flottant recouvrait durablement la dernière ligne de contenu.
     On lui dégage sa hauteur + sa marge, seulement quand il est affiché. */
  body:has(.quick-fab.ready) main{padding-bottom:calc(104px + var(--safe-bottom));}

  .home-section{margin-top:26px;}
  .home-section:first-child{margin-top:4px;}
  .home-section-title{font-size:0.75rem; font-weight:500; text-transform:uppercase; letter-spacing:0.13em;
    color:var(--label); font-family:'IBM Plex Mono', monospace; margin:0 0 12px;}

  /* minmax(0,1fr) et non 1fr : un `1fr` nu vaut minmax(auto,1fr), et ce `auto` interdit
     a la colonne de descendre sous la largeur mini de son contenu. Le detail d'etape
     contient la courbe de maree, qui forcait la piste a 577px dans un conteneur de 339 —
     tout le panneau sortait du cadre. */
  .pad-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;}
  .pad{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px; cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.20), 0 4px 10px rgba(0,0,0,.22); transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out), opacity .15s, border-color .15s;}
    /* Enfoncement plus profond : 4px et une ombre qui se rapproche vraiment de la surface.
     A 2px sur un panneau de verre, le geste ne se lisait plus. */
  .pad:not(.open):active{transform:translateY(4px) scale(.985); box-shadow:var(--glass-edge), 0 1px 3px rgba(0,0,0,.42);}
  .pad.open{box-shadow:none;}
  .pad.open{border-color:var(--accent); background:var(--surface-2);}
  .pad .pad-title{font-family:'Fraunces', serif; font-weight:600; font-size:0.875rem; line-height:1.25;}
  .pad .pad-sub{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--text-muted); margin-top:5px;}
  .pad.active-port .pad-sub::before{content:"◉ "; color:var(--ok);}

  /* overflow:clip et non hidden : clip decoupe selon le border-radius SANS creer de
     conteneur de defilement, donc le position:sticky de la barre contextuelle continue
     de fonctionner contre la page. Verifie : comportement sticky identique avant/apres.
     Sans ca, les enfants pleine largeur (marges negatives) sortaient leurs angles droits
     par-dessus le coin arrondi vert. */
  .pad-detail{grid-column:1 / -1; background:var(--surface-2); border:1px solid var(--accent); border-radius:12px; padding:12px 12px; margin-top:-2px; font-size:0.8125rem; overflow:clip;}
  .pad-detail .k{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; text-transform:uppercase; color:var(--text-muted); margin:8px 0 5px;}
  .pad-detail .k:first-child{margin-top:0;}
  .pad-detail .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .pad-detail .chip{background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 12px; font-size:0.75rem;}
  .chip-empty{font-size:0.75rem; color:var(--text-muted); font-style:italic;}
  .pad-detail .chip.linkable{color:var(--accent); cursor:pointer; border-color:var(--accent);}

  .tide-now{display:flex; align-items:center; gap:12px; margin:6px 0;}
  .tide-state{font-family:'Fraunces', serif; font-weight:600; font-size:0.9375rem; color:var(--accent);}
  .tide-next{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--text-muted);}
  .tide-curve{width:100%; height:52px; margin-top:6px;}
  .tide-source{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; line-height:1.45; color:var(--text-muted); margin:6px 0 2px;}
  .tide-source strong{color:var(--ok); font-weight:600;}
  .tide-warning{background:rgba(var(--flag-rgb),0.10); border:1px solid rgba(var(--flag-rgb),0.35); border-radius:8px; padding:8px 8px; color:#E89AA8; font-size:0.6875rem; line-height:1.45; margin-top:7px;}
  .tide-days{display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none;}
  .tide-days::-webkit-scrollbar{display:none;}
  .tide-day{min-width:92px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:8px 8px; cursor:pointer; text-align:left;}
  .tide-day.on{border-color:var(--accent); background:rgba(var(--accent-rgb),0.10);}
  .tide-day .d{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--text-muted);}
  .tide-day .score{font-family:'Fraunces',serif; font-size:1rem; color:var(--accent); margin-top:2px;}
    /* V6.5.23 — au plancher de 11px, « AORI · 07:00–08:00 » ne tenait plus sur une ligne
     et l'ellipse mangeait l'horaire. Le skill interdit la troncature : on passe a la
     ligne. La rangee de jours defile deja horizontalement par conception. */
  .tide-day .bestfish{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);margin-top:2px;white-space:normal;line-height:1.35;}
  .tide-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:3px 0 8px;}
  .tide-nav button{background:var(--surface); color:var(--accent); border:1px solid var(--border); border-radius:8px; padding:8px 12px; cursor:pointer;}
  .tide-nav button:disabled{opacity:.3; cursor:default;}
  .tide-scorebox{display:flex; align-items:flex-start; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 12px; margin:7px 0;}
  .tide-scorebig{font-family:'Fraunces',serif; font-size:1.5625rem; line-height:1; color:var(--accent); min-width:48px;}
  .tide-scoretxt{font-size:0.75rem; line-height:1.45; color:var(--text-muted);}
  .sun-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:7px 0;}
  .sun-chip{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 4px; text-align:center;}
  .sun-chip .lab{font-family:'IBM Plex Mono',monospace; font-size:0.6875rem; color:var(--text-muted); text-transform:uppercase;}
  .sun-chip .tm{font-family:'IBM Plex Mono',monospace; font-size:0.6875rem; color:var(--text); margin-top:2px;}
  .dest-section{margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}
  .dest-targets{margin:8px 0 10px;}
  .dest-targets .lab{font-family:'IBM Plex Mono',monospace; font-size:0.6875rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;}
  .dest-summary{display:flex; flex-direction:column; gap:8px; margin-top:7px;}
  .dest-row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 12px; line-height:1.5;}
  .dest-row .lab{font-family:'IBM Plex Mono',monospace; font-size:0.6875rem; text-transform:uppercase; color:var(--accent); margin-bottom:4px;}
  .spot-line{margin:4px 0;}
  .spot-line strong{color:var(--text);}
  .intel-details{margin-top:9px;}
  .intel-details summary{cursor:pointer; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:0.6875rem;}
  .intel-list{display:flex; flex-direction:column; gap:8px; margin-top:7px;}
  .intel-item{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 12px; font-size:0.75rem; line-height:1.5;}
  .intel-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:4px;}
  .intel-cat{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:.05em; color:var(--accent);}
  .intel-conf{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--ok);}
  .intel-src{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--text-muted); margin-top:5px;}

  .brief-box{background:var(--surface); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:12px 12px; margin-top:8px; font-size:0.75rem; line-height:1.55;}
  .brief-box .obs-ref{color:var(--accent); font-family:'IBM Plex Mono', monospace; font-size:0.6875rem;}
  .brief-h1{font-family:'Fraunces', serif; font-weight:600; font-size:0.9375rem; color:var(--text); margin-bottom:4px;}
  .brief-h{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); margin:12px 0 5px;}
  .brief-ul{margin:0 0 4px; padding-left:16px;}
  .brief-ul li{margin-bottom:5px;}
  .brief-box p{margin:0 0 6px;}
  .brief-box em{color:var(--text-muted); font-style:italic;}

  .session-btn{display:block; width:100%; text-align:center; background:var(--surface); border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:12px; font-size:0.8125rem; font-weight:600; cursor:pointer; margin-top:10px;}

  .species-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;}
  .species-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 16px; cursor:pointer; text-align:center;}
  /* V6.5.23 — la sphere en degrade ambre ne portait aucune information : deux especes
     differentes avaient exactement le meme disque. Le nom fait le travail. */
  .species-card .name{font-family:'Fraunces', serif; font-weight:500; font-size:1.375rem;
    letter-spacing:-0.015em; line-height:1.12;}
  .species-card .jp{font-family:'IBM Plex Mono', monospace; font-size:0.8125rem; color:var(--label); opacity:.62; margin-top:6px; letter-spacing:.06em;}
  .species-card .count{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--accent); margin-top:4px;}
  .species-card.undoc{opacity:0.4;}
  .species-card.undoc .count{color:var(--text-muted);}

  /* V6.5.9 — navigation espèce sticky, explicite et lisible */
  .species-tabs-wrap{position:sticky;top:calc(var(--app-header-h,76px) - 1px);z-index:9;margin:4px -18px 18px;padding:8px 16px 8px;background:linear-gradient(180deg,var(--bg) 78%,rgba(15,23,32,.96));border-bottom:1px solid var(--border);scroll-margin-top:calc(var(--app-header-h,76px) + 8px);}
  .species-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 0;overscroll-behavior-x:contain;}
  .species-tabs::-webkit-scrollbar{display:none;}
  .species-tab{appearance:none;flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:.035em;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;}
  .species-tab.active{background:rgba(var(--accent-rgb),.12);border-color:var(--accent);color:var(--accent);}
  .species-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* V6.5.9 — aperçu → développement : lire d'abord, approfondir au tap */
  .progressive-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:9px;overflow:hidden;}
  .progressive-block[open]{border-color:rgba(var(--accent-rgb),.34);}
  .progressive-block>summary{list-style:none;cursor:pointer;padding:12px 12px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;}
  .progressive-block>summary::-webkit-details-marker{display:none;}
  .progressive-block>summary::after{content:'+';font-family:'IBM Plex Mono',monospace;font-size:1rem;line-height:1;color:var(--accent);}
  .progressive-block[open]>summary::after{content:'–';}
  .progressive-summary-title{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:4px;}
  .progressive-summary-text{font-size:0.75rem;line-height:1.4;color:var(--text);}
  .progressive-summary-meta{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);margin-top:4px;}
  .progressive-body{border-top:1px solid var(--border);padding:12px 12px 12px;}
  .progressive-body .dest-summary{margin-top:0;}
  .progressive-body .dest-gear{margin-top:0;}
  .tide-support{margin-top:10px;}
  .tide-support .progressive-body{padding-top:8px;}


  /* V6.5.10 — navigation contextuelle, lecture et relations */
  /* Ne porte plus que le bouton « Lecture », visible sur le seul onglet Comprendre :
     sans lui la ligne doit se refermer, pas laisser 28px de vide. */
  .species-context-line{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-height:0;}

  .dest-context-sticky{position:sticky;top:calc(var(--app-header-h,76px) - 1px);z-index:8;margin:-12px -12px 12px;padding:8px 12px;background:rgba(23,34,51,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;backdrop-filter:blur(6px);}

  /* V6.5.23 — hauteur libre : le viewBox impose désormais le rapport, sinon le SVG était
     étiré de façon non uniforme (traits, marqueurs et libellés déformés d'environ 23 %). */
  .tide-curve{width:100%; height:auto; margin:6px 0 4px; display:block; touch-action:pan-y;}
  .tide-curve:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* V6.5.23 — couche de lecture : équivalent tactile du survol. Appui long puis glissement,
     ou flèches au clavier. Elle enrichit sans conditionner : toutes les valeurs restent
     lisibles dans les fiches de fenêtre en dessous. */
  .tide-chart{position:relative;}
  .tide-chart.is-scrubbing .tide-curve{touch-action:none;}
  .tide-crosshair{position:absolute;top:0;width:1px;background:var(--text-muted);opacity:.6;pointer-events:none;display:none;}
  .tide-chart.is-scrubbing .tide-crosshair{display:block;}

  .loadout-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:flex-end;margin-bottom:12px;}

     tout le detail reste accessible au clic. */

     ecran entier pour rien. 64px = la hauteur d'une ligne de liste confortable. */

  }

  /* V6.2 — Evidence Engine: opportunité ≠ niveau de preuve */
  .evidence-strip{margin:10px 0 0;border-top:1px solid var(--border);padding-top:10px;}
  .evidence-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .evidence-title{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);}
  .ev-badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;line-height:1.1;white-space:nowrap;background:transparent;}
  .ev-badge.very{color:var(--ok);border-color:rgba(95,168,122,.55);}
  .ev-badge.solid{color:var(--accent);border-color:rgba(var(--accent-rgb),.5);}
  .ev-badge.signal{color:#6FB1D6;border-color:rgba(111,177,214,.5);}
  .ev-badge.hyp{color:var(--text-muted);border-color:rgba(139,151,168,.35);}
  .ev-badge.personal{color:#9BB8D6;border-color:rgba(155,184,214,.5);}
  .ev-dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;}
  .evidence-facets{display:flex;flex-wrap:wrap;gap:4px;}
  .ev-facet{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(139,151,168,.18);border-radius:8px;padding:4px 8px;background:var(--surface-2);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);}
  .ev-facet strong{font-weight:600;color:var(--text);}
  .ev-facet .quality{font-size:0.6875rem;text-transform:uppercase;letter-spacing:.04em;}
  .ev-why{margin-top:8px;border-top:1px dashed rgba(139,151,168,.22);padding-top:7px;}
  .ev-why summary{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);}
  .ev-dims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .ev-dim{background:var(--surface-2);border:1px solid rgba(139,151,168,.14);border-radius:8px;padding:8px 8px;}
  .ev-dim .lab{display:flex;justify-content:space-between;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;}
  .ev-meter{height:3px;border-radius:999px;background:rgba(139,151,168,.16);overflow:hidden;}
  .ev-meter>span{display:block;height:100%;background:currentColor;border-radius:999px;}
  .ev-dim.very{color:var(--ok)} .ev-dim.solid{color:var(--accent)} .ev-dim.signal{color:#6FB1D6} .ev-dim.hyp{color:var(--text-muted)}
  .ev-note{font-size:0.6875rem;line-height:1.45;color:var(--text-muted);margin-top:7px;}
  .ev-note strong{color:var(--text);font-weight:600;}
  .evidence-legend{font-size:0.6875rem;line-height:1.5;color:var(--text-muted);margin-bottom:10px;}
  .evidence-legend strong{color:var(--text);}
  .evidence-model{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px;}
  .evidence-model .item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 12px;}
  .evidence-model .name{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:4px;}
  .evidence-model .txt{font-size:0.6875rem;line-height:1.45;color:var(--text-muted);}
  .reco-proofline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:7px 0 3px;}
  .context-fit{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);border-left:2px solid #6FB1D6;padding-left:6px;}
  .intel-proof{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .raw-source{font-size:0.6875rem;color:var(--text-muted);margin-top:4px;}
  @media(max-width:390px){.ev-dims,.evidence-model{grid-template-columns:1fr}}

  /* V6.5.1 — feedback immédiat pendant les rares calculs non encore en cache */
  .perf-loading-row{display:flex;align-items:center;gap:8px;min-height:54px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;}
  .perf-spinner{width:14px;height:14px;border:2px solid rgba(139,151,168,.22);border-top-color:var(--accent);border-radius:50%;animation:perfSpin .65s linear infinite;flex:0 0 auto;}
  .pad-detail.perf-refreshing{opacity:.72;transition:opacity .12s ease;}
  @keyframes perfSpin{to{transform:rotate(360deg)}}


  /* V6.5.11 — navigation augmentée : peek, carte, focus, densité, glossaire, rail, gestes, accès rapide */
  .home-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .home-title-row .home-section-title{margin:0;}
  .trip-view-toggle{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px;}
  .trip-view-toggle button{appearance:none;border:0;background:transparent;color:var(--text-muted);border-radius:999px;padding:4px 8px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;cursor:pointer;}
  .trip-view-toggle button.on{background:rgba(var(--accent-rgb),.13);color:var(--accent);}
  .focus-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:8px 12px;border:1px solid rgba(var(--accent-rgb),.38);background:rgba(var(--accent-rgb),.075);border-radius:12px;}
  .focus-banner .copy{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);min-width:0;}
  .focus-banner strong{color:var(--accent);}
  .focus-banner button,.focus-toggle{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:999px;padding:8px 8px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;cursor:pointer;white-space:nowrap;}
  .focus-toggle.on{background:rgba(var(--accent-rgb),.15);border-color:var(--accent);}
  .pad,.species-card{position:relative;}
  .species-card{transition:opacity .15s,border-color .15s;}
  .focus-miss{opacity:.42;}
  .focus-hit{border-color:rgba(var(--accent-rgb),.48)!important;}
  .peek-btn{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:rgba(15,23,32,.78);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;cursor:pointer;display:grid;place-items:center;z-index:2;}
  .peek-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .trip-map-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;overflow:hidden;}
  .trip-map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .trip-map-title{font-family:'Fraunces',serif;font-size:1rem;font-weight:600;color:var(--text);}
  .trip-map-note{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);margin-top:3px;line-height:1.45;max-width:560px;}
  .trip-map-canvas{position:relative;width:100%;aspect-ratio:3 / 2;min-height:220px;background:linear-gradient(180deg,rgba(111,177,214,.08),rgba(111,177,214,.025));border:1px solid rgba(111,177,214,.18);border-radius:12px;overflow:hidden;touch-action:manipulation;}
  .trip-map{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .trip-map-sea-grid{stroke:rgba(139,151,168,.075);stroke-width:1;}
  .trip-map-land{fill:rgba(139,151,168,.16);stroke:rgba(139,151,168,.38);stroke-width:1.2;vector-effect:non-scaling-stroke;}
  .trip-map-path{fill:none;stroke:rgba(var(--accent-rgb),.78);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;}
  .trip-map-path-halo{fill:none;stroke:rgba(15,23,32,.78);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
  .trip-map-pin{position:absolute;transform:translate(-50%,-50%) translate(var(--pin-dx,0),var(--pin-dy,0));width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:var(--surface-2);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;font-weight:700;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.38);z-index:3;}
  .trip-map-pin::after{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.2);}
  .trip-map-pin.start{background:var(--accent);color:#0F1720;}
  .trip-map-pin.end{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16),0 3px 12px rgba(0,0,0,.38);}
  .trip-map-pin.focus-miss{opacity:.30;}
  .trip-map-pin.focus-hit{box-shadow:0 0 0 4px rgba(var(--accent-rgb),.20),0 4px 14px rgba(0,0,0,.42);}
  .trip-map-pin:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  .trip-map-compass{position:absolute;right:9px;top:8px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);letter-spacing:.08em;z-index:2;pointer-events:none;}
  .trip-map-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .trip-map-link{appearance:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:12px;padding:12px 12px;min-height:52px;text-align:left;cursor:pointer;font-size:0.6875rem;line-height:1.35;}
  .trip-map-link strong{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(var(--accent-rgb),.12);color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;margin-right:6px;vertical-align:middle;}
  .trip-map-link span{color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;display:block;margin-top:3px;padding-left:30px;}
  .trip-map-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .ux-backdrop{position:fixed;inset:0;z-index:70;background:rgba(4,8,14,.58);backdrop-filter:blur(14px) saturate(140%);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s var(--ease-out);}
  .ux-backdrop.open{display:flex;}
  .ux-backdrop.is-open{opacity:1;}
  .ux-sheet{width:min(720px,100%);max-height:min(78vh,720px);overflow:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:12px 16px calc(18px + var(--safe-bottom));box-shadow:0 -16px 50px rgba(0,0,0,.38);transform:translateY(100%);transition:transform .28s var(--ease-drawer);}
  .ux-backdrop.is-open .ux-sheet{transform:translateY(0);}
  .ux-sheet-handle{width:42px;height:4px;border-radius:99px;background:rgba(139,151,168,.35);margin:1px auto 12px;}
  .ux-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .ux-sheet-title{font-family:'Fraunces',serif;font-size:1.125rem;font-weight:600;line-height:1.2;}
  .ux-sheet-sub{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);margin-top:4px;line-height:1.45;}
  .ux-sheet-close{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:1rem;}
  .ux-sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ux-action{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:12px;text-align:left;font-size:0.75rem;line-height:1.35;cursor:pointer;}
  .ux-action strong{display:block;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .ux-action.primary{border-color:var(--accent);background:rgba(var(--accent-rgb),.09);}
  .ux-sheet-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .ux-sheet-label{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;}
  .density-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
  .density-switch button{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:8px;padding:8px 4px;font-size:0.6875rem;cursor:pointer;}
  .density-switch button.on{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.08);}
  .peek-score{display:flex;align-items:flex-end;gap:12px;margin:8px 0 12px;}
  .peek-score .big{font-family:'Fraunces',serif;font-size:2rem;color:var(--accent);line-height:1;}
  .peek-score .meta{font-size:0.6875rem;color:var(--text-muted);line-height:1.45;}
  .peek-pills{display:flex;flex-wrap:wrap;gap:8px;margin:7px 0;}
  .peek-pill{border:1px solid var(--border);border-radius:999px;padding:4px 8px;font-size:0.6875rem;color:var(--text-muted);background:var(--surface);}

  .quick-fab{position:fixed;right:16px;bottom:calc(16px + var(--safe-bottom));z-index:35;width:46px;height:46px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:#0F1720;font-size:1.5rem;line-height:1;display:none;place-items:center;box-shadow:0 9px 24px rgba(0,0,0,.34);cursor:pointer;}
  .quick-fab.ready{display:grid;}
  body.reading-mode .quick-fab{display:none!important;}
  body.reading-mode .reading-exit{z-index:72;}

  .species-rail{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:18;display:none;width:18px;height:190px;pointer-events:none;opacity:0;transition:opacity .18s var(--ease-out);}
  body.species-view:not(.reading-mode) .species-rail{display:block;}
  /* V6.5.23 — le rail ne s'affiche que lorsqu'il ne recouvre plus le bandeau d'onglets.
     Sans ça, ses pastilles agrandies (30–32px) captaient le tap destiné au dernier onglet. */
  .species-rail.is-clear{opacity:1;}
  .species-rail:not(.is-clear) .species-rail-dot{pointer-events:none;}
  .species-rail-track{position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:rgba(139,151,168,.18);border-radius:99px;overflow:hidden;}
  .species-rail-fill{display:block;width:100%;height:100%;transform:scaleY(var(--rail-progress,0));transform-origin:top center;background:var(--accent);border-radius:99px;transition:transform .08s linear;}
  .species-rail-dots{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;}
  .species-rail-dot{pointer-events:auto;appearance:none;width:10px;height:10px;border:2px solid var(--bg);border-radius:50%;background:#586477;padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(139,151,168,.22);}
  .species-rail-dot.on{background:var(--accent);box-shadow:0 0 0 1px var(--accent);}

  .glossary-term{appearance:none;border:0;border-bottom:1px dotted var(--accent);background:transparent;color:inherit;padding:0;font:inherit;cursor:help;}
  .glossary-term::after{content:'·';color:var(--accent);font-size:.75em;vertical-align:super;margin-left:1px;}
  .glossary-definition{font-size:0.875rem;line-height:1.65;color:var(--text);}
  .glossary-warning{font-size:0.6875rem;line-height:1.5;color:var(--text-muted);margin-top:9px;}

  body.density-compact main{padding-top:10px;}
  body.density-compact .home-section{margin-top:18px;}
  body.density-compact .pad{padding:12px 12px;border-radius:12px;}
  body.density-compact .species-grid{gap:8px;}
  body.density-compact .species-card{padding:12px 12px;border-radius:12px;}
  body.density-compact .dest-row,body.density-compact .intel-item,body.density-compact .field-card,body.density-compact .tech-card{padding:8px 8px;}
  body.density-compact .section{margin-top:18px;}
  body.density-compact .progressive-block>summary{padding:8px 12px;}
  body.density-compact .relation-block{padding:12px;margin-top:12px;}

  body.density-reading main{max-width:880px;margin-left:auto;margin-right:auto;}
  body.density-reading .dest-row,body.density-reading .brief-box,body.density-reading .intel-item,body.density-reading .field-value,body.density-reading .tech-v,body.density-reading .behav-txt,body.density-reading .fact-card,body.density-reading .synth-box{font-size:0.875rem;line-height:1.72;}
  body.density-reading .section{margin-top:30px;}
  body.density-reading .progressive-summary-text{font-size:0.8125rem;line-height:1.55;}
  body.density-reading .pad-detail{font-size:0.8125rem;}

  .species-context-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  .focus-inline{font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--accent);border:1px solid rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.06);border-radius:8px;padding:8px 8px;margin-bottom:9px;}
  .swipe-flash{position:fixed;left:50%;bottom:calc(76px + var(--safe-bottom));transform:translateX(-50%);z-index:60;background:rgba(15,23,32,.94);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:0.6875rem;color:var(--text-muted);pointer-events:none;animation:swipeFlash .8s var(--ease-out) both;}
  @keyframes swipeFlash{0%{opacity:0;transform:translate(-50%,6px)}20%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}

  @media(max-width:430px){
    .ux-sheet-grid{grid-template-columns:1fr;}
    .quick-fab{right:12px;bottom:calc(12px + var(--safe-bottom));width:44px;height:44px;}
    .trip-map-list{grid-template-columns:1fr;}
    .home-title-row{align-items:flex-start;}
    .trip-view-toggle button{padding:4px 8px;font-size:0.6875rem;}
    .species-context-line{align-items:flex-start;}
    .species-context-actions{gap:4px;}
    .focus-toggle,.reading-start{padding:4px 8px;font-size:0.6875rem;}
  }
  @media(min-width:900px){
    .species-rail{right:16px;width:24px;}
    .species-rail-track{left:11px;}
    .species-rail-dot{width:12px;height:12px;}
  }

  /* V6.5.12 — UX mobile : cibles tactiles lisibles et contrôles cohérents */
  .back-btn{min-width:44px;min-height:44px;display:inline-grid;place-items:center;padding:0;}
  .tide-nav button,.tide-day,.species-tab,.relation-pill,.reading-start,.collapse-all-btn,.window-plan-btn,.field-cta button,.density-switch button{min-height:44px;}
  .trip-view-toggle button{min-height:44px;padding:8px 12px;font-size:0.6875rem;}
  .focus-banner button,.focus-toggle{min-height:40px;padding:8px 12px;font-size:0.6875rem;}
  .peek-btn{width:44px;height:44px;right:6px;top:6px;font-size:0.875rem;}
  .pad .pad-title{padding-right:36px;}
  .species-card{padding-top:22px;}
  .ux-sheet-close{width:44px;height:44px;flex:0 0 44px;font-size:1.25rem;}
  .ux-action{min-height:56px;padding:12px 12px;}
  .quick-fab{width:54px;height:54px;font-size:1.75rem;}
  .species-rail{right:2px;width:40px;height:250px;}
  .species-rail-track{left:19px;top:18px;bottom:18px;}
  .species-rail-dot{width:32px;height:32px;border-width:7px;background-clip:padding-box;}
  .qcm-opt,.qcm-cta,.obs-chip,.log-save,.log-form .row3 button{min-height:46px;}
  .log-export{min-height:44px;display:flex;align-items:center;justify-content:center;}
  @media(max-width:430px){
    .trip-map-wrap{padding:12px;}
    .trip-map-canvas{min-height:240px;}
    .trip-map-list{grid-template-columns:1fr;}
    .trip-view-toggle button{min-height:44px;padding:8px 12px;font-size:0.6875rem;}
    .focus-toggle,.reading-start{min-height:44px;padding:8px 12px;font-size:0.6875rem;}
    .quick-fab{right:12px;bottom:calc(12px + var(--safe-bottom));width:52px;height:52px;}
    .species-rail{right:0;width:38px;}
    .species-rail-track{left:18px;}
    .species-rail-dot{width:30px;height:30px;}
  }

  /* ===== Arbre de décision ===== */
  /* V6.5.23 — verre blanc, plus de rose. L'action reste primaire par sa largeur pleine
     et son relief, pas par une couleur qui jurait avec la palette turquoise. */
  .tree-launch{all:unset; cursor:pointer; display:block; width:100%; box-sizing:border-box; margin-top:12px; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.04) 100%);
    border:1px solid rgba(255,255,255,.26); color:#F2F5F8; font-weight:600; font-size:0.875rem; padding:12px 12px; border-radius:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.46), inset 0 -2px 6px rgba(0,0,0,.24),
               0 6px 18px rgba(0,0,0,.34); transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out);}
  .tree-launch:active{transform:translateY(4px) scale(.985); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 1px 4px rgba(0,0,0,.44);}
  .tree-overlay{position:fixed; inset:0; z-index:200; background:rgba(8,12,18,0.86); backdrop-filter:blur(14px) saturate(140%);
    display:flex; align-items:flex-end; justify-content:center; padding:12px;
    opacity:0; transition:opacity .18s var(--ease-out);}
  .tree-overlay.is-open{opacity:1;}
  .tree-card{background:var(--surface); border:1px solid var(--border); border-radius:20px 20px 16px 16px; width:100%; max-width:520px;
    padding:20px 18px calc(18px + env(safe-area-inset-bottom)); position:relative; box-shadow:0 -8px 40px rgba(0,0,0,0.5);
    transform:translateY(24px); transition:transform .22s var(--ease-drawer);}
  .tree-overlay.is-open .tree-card{transform:translateY(0);}
  .tree-close{all:unset; cursor:pointer; position:absolute; top:12px; right:14px; font-size:1.625rem; line-height:1; color:var(--text-muted);}
  .tree-cond{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; padding-right:30px;}
  .tree-global{display:flex; gap:12px; align-items:flex-start; background:rgba(var(--accent-rgb),0.1); border:1px solid var(--accent-dim); border-radius:12px; padding:12px; margin-bottom:14px;}
  .tree-global-icon{font-size:1.25rem; line-height:1.2;}
  .tree-global-msg{font-size:0.875rem; font-weight:600; color:var(--accent); line-height:1.45;}
  .tree-thin{background:rgba(var(--flag-rgb),0.12); border:1px solid var(--flag); border-radius:12px; padding:8px 12px; font-size:0.75rem; color:var(--flag); margin-bottom:12px; line-height:1.4;}
  .tree-step{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--text-muted); margin-bottom:4px;}
  .tree-lever-name{font-family:'Fraunces', serif; font-weight:600; font-size:0.9375rem; color:var(--accent); margin-bottom:8px;}
  .tree-boost{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--flag); background:rgba(var(--flag-rgb),0.15); padding:2px 8px; border-radius:999px; vertical-align:middle;}
  .tree-action{font-size:1.0625rem; line-height:1.5; color:var(--text); margin-bottom:10px; font-weight:500;}
  .tree-why{font-size:0.75rem; line-height:1.5; color:var(--text-muted); font-style:italic; margin-bottom:16px; padding-left:10px; border-left:2px solid var(--border);}
  .tree-actions{display:flex; gap:12px;}
  .tree-btn{all:unset; cursor:pointer; flex:1; text-align:center; padding:16px 12px; border-radius:16px; font-weight:600; font-size:0.9375rem;
    box-shadow:0 3px 0 rgba(0,0,0,.26), 0 5px 12px rgba(0,0,0,.28); transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out);}
  .tree-btn.ghost{background:var(--surface-2); color:var(--text);}
  .tree-btn.ok{background:var(--ok); color:#0F1720;}
  .tree-btn.ghost:active,.tree-btn.ok:active{transform:translateY(4px) scale(.985); box-shadow:0 1px 2px rgba(0,0,0,.42);}
  .tree-tried{margin-top:14px; display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:0.6875rem; color:var(--text-muted);}
  .tree-tried-chip{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; padding:2px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); text-decoration:line-through;}
  .tree-end,.tree-solved-note{font-size:0.875rem; line-height:1.55; color:var(--text); margin:12px 0 16px;}
  .tree-badge{display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.06em; padding:2px 12px; border-radius:999px; background:var(--surface-2); color:var(--text-muted); margin-bottom:6px;}
  .tree-badge.is-ok{background:rgba(95,168,122,0.18); color:var(--ok);}
  .tree-solved-title{font-family:'Fraunces', serif; font-weight:600; font-size:1.25rem; color:var(--ok); margin:6px 0 8px;}
  .tree-solved-lever{font-size:0.875rem; color:var(--text); margin-bottom:4px;}
  .tree-solved-lever strong{color:var(--accent);}
  body.tree-open{overflow:hidden;}
  /* Croisement état × réaction */
  .cross-block{margin-bottom:12px; padding:12px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .cross-act{font-family:'Fraunces', serif; font-weight:600; font-size:0.875rem; color:var(--accent); margin-bottom:9px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cross-ev{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; font-weight:400; color:var(--ok);}
  .cross-ev.is-weak{color:var(--flag);}
  .cross-dim{display:flex; gap:8px; align-items:baseline; padding:3px 0;}
  .cross-dim-lab{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-muted); min-width:54px; flex:none;}
  .cross-dim-vals{display:flex; flex-wrap:wrap; gap:4px;}
  .cross-pill{font-size:0.75rem; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px 8px;}
  .cross-n{font-family:'IBM Plex Mono', monospace; font-size:0.6875rem; color:var(--text-muted);}

  /* V6.5.23 — §2/§9 apple-design : le panneau suit le doigt avec résistance progressive,
     puis revient. La transition ne sert qu'au retour, doigt levé ; un nouveau geste
     repart de la valeur affichée (voir swipeLiveX) pour ne pas sauter. */
  #tabPanel,[id^="stopDetail-"]{touch-action:pan-y;}
  .swipe-settling{transition:transform .34s var(--ease-drawer);}

  /* V6.5.23 — §12 apple-design : une grande surface doit lire plus épais qu'une petite.
     C'était inversé — la barre contextuelle avait 8px de flou, les deux voiles plein
     écran seulement 3px. */
  @media (prefers-reduced-transparency: reduce){
    .ux-backdrop{background:rgba(4,8,14,.93);backdrop-filter:none;}
    .tree-overlay{background:rgba(8,12,18,.97);backdrop-filter:none;}
    .dest-context-sticky{background:var(--surface);backdrop-filter:none;}
    /* Le verre redevient opaque et la nappe disparaît : sans elle, le flou n'aurait
       plus rien à échantillonner, et surtout le réglage demande de la matière franche. */
    body::before{background:var(--bg);}
    header{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;}
    .pad,.species-card,.pad-detail,.trip-map-wrap,.loadout-card,.tide-focus-card{
      background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none;
    }
    .pad.open{background:var(--surface-2);}
  }
  @media (prefers-contrast: more){
    .ux-sheet,.tree-card,.pad,.species-card,.fish-window-row{border-color:var(--accent);}
    .ux-backdrop{background:rgba(4,8,14,.95);backdrop-filter:none;}
    .tree-overlay{background:rgba(8,12,18,.98);backdrop-filter:none;}
  }

  /* V6.5.23 — sous 390px les cinq onglets débordaient (378px de contenu pour 347px utiles) :
     « Comprendre » sortait de l'écran. On resserre l'espacement plutôt que la hauteur,
     pour ne pas rogner la cible tactile. */
  /* V6.5.23 — au plancher typographique de 11px les cinq onglets ne tiennent plus sur une
     ligne (399px pour 347 utiles). Le skill demande que la mise en page grandisse ou passe
     à la ligne, jamais qu'elle tronque : on enroule sur deux rangées plutôt que de cacher
     « Comprendre » derrière un défilement horizontal qu'on ne remarque pas. */
  /* V6.5.23 — textes explicatifs d'accompagnement. Ils s'adressent a quelqu'un qui
     decouvre le domaine ; l'utilisateur le connait. Masques et non supprimes : le
     contenu reste dans le code, retirer cette ligne les fait revenir tels quels. */
  /* .ux-combo-meta : le PE et la plage de grammage flottaient a cote du badge M/MH.
     La meme information est portee par la carte « Combo » du plan de jeu, en clair. */
  .ux-section-lead,.hint,.trip-map-note,.field-cta .txt,.ux-pattern-sub,.ux-combo-meta{display:none;}

  /* V6.5.23 — bloc de tete de fiche espece. Il faisait 156px encadres pour dire ce que
     les onglets disent ensuite : on retire la prose, on degonfle le cadre et on garde
     les seules donnees actionnables — motif, combo, chips de situation. */
  .species-loadout{background:transparent !important; border:0 !important; box-shadow:none !important;
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important; padding:0 !important;
    margin-bottom:12px;}
  .species-loadout .ux-pattern{font-size:1.125rem; line-height:1.25;}
  .species-loadout .ux-hero-rule{border-top:1px solid var(--border); padding-top:10px; margin-top:10px;}

  /* V6.5.23 — repartition imposee : trois onglets puis deux. En laissant le retour a
     la ligne libre, la coupure dependait de la largeur des libelles. Un tiers de la
     largeur par onglet fixe la premiere ligne a trois ; la seconde en recoit deux,
     centrees par justify-content. */
  .species-tabs{flex-wrap:wrap;row-gap:8px;justify-content:center;}
  .species-tabs .species-tab{flex:0 0 calc((100% - 16px) / 3);}
  @media(max-width:390px){
    .species-tabs{gap:4px;row-gap:8px;}
    .species-tabs .species-tab{flex:0 0 calc((100% - 8px) / 3);}
    .species-tab{padding:8px 8px;}
  }

  /* ===== V6.5.23 — matériaux et géométrie (skill apple-design-materials) ===== */

  /* Coins continus. Un border-radius classique raccorde par tangence : la courbure saute
     de 0 à 1/r, et l'œil lit ce coude. Le squircle d'Apple a une courbure continue.
     corner-shape n'existe que sur Chrome 139+ — amélioration progressive, le rayon
     classique reste le repli partout ailleurs. */
  @supports (corner-shape: squircle){
    .pad,.pad-detail,.species-card,.fish-window-row,.trip-map-wrap,.trip-map-canvas,
    .trip-map-link,.ux-sheet,.ux-action,.tree-card,.tree-global,.tree-btn,.tree-launch,
    .field-card,.intel-item,.cross-block,.focus-banner{
      corner-shape:squircle;
    }
    /* Jamais sur un élément rond : squircle + border-radius:50% donne un carré arrondi,
       pas un cercle. Le bouton flottant et les pastilles restent circulaires. */
  }

  /* Couches flottantes : palier d'élévation plus clair, arête supérieure spéculaire,
     ombre d'ancrage. Jamais de verre sur du verre — ces surfaces sont opaques et
     posées SUR le voile flou, pas floutées elles-mêmes. */
  .ux-sheet{background:var(--surface-3); box-shadow:var(--glass-lift),var(--glass-edge);}
  .tree-card{background:var(--surface-3); box-shadow:var(--glass-lift),var(--glass-edge);}

  /* Action principale : l'arête claire capte la lumière, l'ombre l'ancre au-dessus du
     contenu qui défile dessous. */
  .quick-fab{box-shadow:0 10px 28px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.34);}

  /* Moins de traits, plus d'élévation : les cartes se détachent par la lumière et
     l'ombre plutôt que par un contour permanent. */
  .pad,.species-card,.fish-window-row,.field-card,.intel-item,.cross-block{
    border-color:rgba(var(--accent-rgb),.10);
  }

  /* ===== Blocs en verre =====
     Seuls les blocs de PREMIER niveau échantillonnent la nappe. Empiler du verre sur du
     verre détruit la lisibilité — les contenus imbriqués reçoivent un simple voile clair.
     blur(20px) saturate(160%) : valeurs prescrites pour une nappe multi-teintes. En
     dessous de 130% de saturation le flou délave les couleurs vers le gris. */
  .pad,.species-card,.pad-detail,.trip-map-wrap,.loadout-card{
    background:var(--glass-panel);
    backdrop-filter:blur(28px) saturate(185%) brightness(108%);
    -webkit-backdrop-filter:blur(28px) saturate(185%) brightness(108%);
    box-shadow:var(--glass-edge), 0 10px 30px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.22);
  }
  .pad.open{background:var(--glass-panel-soft);}

  /* Ces deux-là vivent DANS .pad-detail, qui est déjà du verre. Empiler y détruirait la
     lisibilité et doublerait le coût de composition pour rien : elles reçoivent un voile. */
  .pad-detail .dest-context-sticky,.pad-detail .tide-focus-card{
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  /* Cette barre est sticky : elle passe PAR-DESSUS le graphique en defilant. A 82%
     d'opacite, le titre et la bande d'especes transparaissaient au travers et
     salissaient les coins. Elle doit etre franchement opaque. */
  /* Rayon interieur = 12px du panneau moins son bord de 1px. Sert de repli la ou
     overflow:clip n'existe pas ; inoffensif ailleurs. */
  .pad-detail .dest-context-sticky{background:#1B2942; box-shadow:0 6px 16px rgba(0,0,0,.34); border-radius:11px 11px 0 0;}
  .pad-detail .tide-focus-card{background:rgba(255,255,255,.06);}

  /* Contenus imbriqués : pas de second niveau de verre, juste un voile qui les décolle
     du panneau qui les porte. */
  .pad-detail .field-card,.pad-detail .intel-item,.pad-detail .cross-block,
  .pad-detail .fish-window-row,.pad-detail .tide-day,.pad-detail .brief-box,
  .pad-detail .synth-box,.pad-detail .dest-row,.trip-map-wrap .trip-map-link{
    background:rgba(255,255,255,.055);
    backdrop-filter:none; -webkit-backdrop-filter:none;
  }

  /* La nappe transparaît sous le verre : le texte secondaire doit remonter en contraste,
     sinon il se dissout dans les nuages. */
  .pad .pad-sub,.species-card .jp,.pad-detail .k{color:#A3AEBE;}

  /* La pastille d'aperçu est posée en absolu dans le coin : le texte doit lui céder la
     place, sinon il passe dessous. Elle fait 44px + 6px de marge. */
  .pad:has(.peek-btn) .pad-title,.pad:has(.peek-btn) .pad-sub{
    padding-right:52px;
  }
  /* Carte espece : texte centre sur deux lignes, donc aucun coin n'est libre — ni en
     haut (le nom), ni en bas (le japonais). Un decalage horizontal desaxerait le texte.
     La seule mise en page qui ne puisse pas entrer en collision est de reserver au
     bouton sa propre bande en haut de la carte. */
  /* La bande reservee par padding-top sautait en densite compacte, ou
     body.density-compact .species-card{padding:12px} est plus specifique. On sort donc
     le bouton du positionnement absolu : place dans le flux, il ne peut plus recouvrir
     le texte, quelle que soit la densite. */
  .species-card{display:flex; flex-direction:column;
    transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out), opacity .15s, border-color .15s;}
  .species-card:active{transform:translateY(4px) scale(.985); box-shadow:var(--glass-edge), 0 1px 3px rgba(0,0,0,.42);}
  .quick-fab:active{transform:translateY(3px) scale(.94);}
  /* Ordre visuel : nom romaji en haut, japonais dessous, pastille repoussee dans le
     coin inferieur droit par margin-top:auto. Le bouton reste dans le flux — il occupe
     donc sa propre place et ne peut pas recouvrir le texte, quelle que soit la densite.
     Le DOM le place en premier ; `order` le renvoie en dernier sans toucher au markup. */
  .species-card .name{order:0; margin-top:0;}
  .species-card .jp{order:1; margin-bottom:0;}
  .species-card .peek-btn{order:2; align-self:flex-end; margin:12px 0 0; position:static;}

  /* Pastille en verre — commune aux cartes espece ET aux fiches destination.
     Pas de backdrop-filter : la carte en est deja une, et empiler deux flous fait
     echantillonner a l'interieur du flou du dessous — l'image se delave et le cout de
     composition double. L'effet vient donc du modele : degrade de bille, arete
     speculaire en haut, ombre interne en bas, halo exterieur. */
  .peek-btn{
    background:linear-gradient(160deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.06) 42%, rgba(0,0,0,.22) 100%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42),
               inset 0 -2px 4px rgba(0,0,0,.30),
               0 4px 12px rgba(0,0,0,.34),
               0 0 0 1px rgba(var(--accent-rgb),.16);
    color:var(--accent);
    text-shadow:0 1px 2px rgba(0,0,0,.5);
    transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out);
  }
  .peek-btn:active{
    transform:translateY(2px) scale(.94);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),
               inset 0 -1px 3px rgba(0,0,0,.34),
               0 1px 4px rgba(0,0,0,.4),
               0 0 0 1px rgba(var(--accent-rgb),.28);
  }

  /* Chaque carte prend la hauteur de son contenu. Étirer une carte courte sur la hauteur
     de sa voisine crée des blocs vides qui ne veulent rien dire. */
  .pad-grid{align-items:start;}

  /* Sur téléphone, deux colonnes ne laissaient que ~87px de texte utile une fois la
     pastille d'aperçu déduite : les titres cassaient en trois ou quatre lignes. Une
     colonne unique donne 339px, la pastille ne coûte plus rien, et on retrouve le
     rythme d'une liste iOS. Deux colonnes reviennent dès qu'il y a la place. */
  @media(max-width:520px){
    .pad-grid{grid-template-columns:minmax(0,1fr);}
    .pad:has(.peek-btn) .pad-title,.pad:has(.peek-btn) .pad-sub{padding-right:52px;}
  }

  /* V6.5.23 — mouvement réduit : on retire les déplacements, on garde fondus et couleurs.
     Volontairement conservés : le retour de pression translateY(2px) (confirmation tactile
     directe) et .perf-spinner (seul indicateur de chargement de l'app). */
  @media (prefers-reduced-motion: reduce){
    .tree-card,.tree-overlay.is-open .tree-card{transform:none;transition:none;}
    .ux-sheet,.ux-backdrop.is-open .ux-sheet{transform:none;transition:none;}
    .species-rail-fill{transition:none;}
    .swipe-flash{animation:swipeFlashReduced .8s linear both;}
    @keyframes swipeFlashReduced{0%{opacity:0}20%,70%{opacity:1}100%{opacity:0}}
  }
</style>
</head>
<body>

<header id="headerZone"></header>
<main id="mainZone"></main>
<div id="treeZone"></div>
<nav id="speciesRail" class="species-rail" aria-label="Progression fiche espèce"></nav>
<button id="quickFab" class="quick-fab" onclick="openQuickAccess()" aria-label="Accès rapide">+</button>
<button id="readingExit" class="reading-exit" onclick="toggleReadingMode()">Quitter Lecture</button>
<div id="uxBackdrop" class="ux-backdrop" onclick="if(event.target===this)closeUXSheet()"><section id="uxSheet" class="ux-sheet" role="dialog" aria-modal="true" aria-labelledby="uxSheetTitle"></section></div>

<script>
/* ============ MARÉES OFFICIELLES EMBARQUÉES (JMA) ============
   V5.1 : plus de constantes harmoniques fictives. L'app lit tides_2026.json,
   construit l'état montante/descendante entre PM/BM officielles et interpole
   uniquement pour dessiner la courbe. Les valeurs JMA sont des PRÉVISIONS
   astronomiques, pas des niveaux observés en temps réel. */
const JST_OFFSET_MS = 9*3.6e6;
let TIDES = {ports:{}, source_note:'Prévisions astronomiques JMA embarquées.'};
const PORTS = {
  shimizu: {label:'Shimizu Port (JMA)', lat:35.02, lng:138.49},
  fukuoka: {label:'Hakata (JMA)', lat:33.60, lng:130.40},
  itoshima:{label:'Itoshima · réf. Hakata JMA', lat:33.58, lng:130.20},
  kobe:    {label:'Kobe (JMA)', lat:34.69, lng:135.19},
  toba:    {label:'Toba JMA · proxy Ise-Shima', lat:34.48, lng:136.84},
  numazu:  {label:'Uchiura / Numazu (JMA)', lat:35.02, lng:138.88},
  tokyo:   {label:'Tokyo (JMA)', lat:35.65, lng:139.77},
  kashima: {label:'Kashima (JMA)', lat:35.94, lng:140.69},
};

function jstParts(d){
  const j = new Date(d.getTime()+JST_OFFSET_MS);
  return {y:j.getUTCFullYear(), m:j.getUTCMonth()+1, d:j.getUTCDate(), hh:j.getUTCHours(), mm:j.getUTCMinutes()};
}
function dateKeyJST(d){
  const x=jstParts(d), pad=n=>String(n).padStart(2,'0');
  return `${x.y}-${pad(x.m)}-${pad(x.d)}`;
}
function shiftDateKey(key, days){
  const [y,m,d]=key.split('-').map(Number);
  const z=new Date(Date.UTC(y,m-1,d+days));
  const pad=n=>String(n).padStart(2,'0');
  return `${z.getUTCFullYear()}-${pad(z.getUTCMonth()+1)}-${pad(z.getUTCDate())}`;
}
function dateFromJST(key, hm='12:00'){
  return new Date(`${key}T${hm}:00+09:00`);
}
function hrJST(d){
  if(!d) return null;
  const j=new Date(d.getTime()+JST_OFFSET_MS);
  return j.getUTCHours()+j.getUTCMinutes()/60;
}
function fmtJST(d){
  if(!d) return '—';
  const j=new Date(d.getTime()+JST_OFFSET_MS);
  return `${String(j.getUTCHours()).padStart(2,'0')}:${String(j.getUTCMinutes()).padStart(2,'0')}`;
}
function officialTideDay(portKey, dateOrKey){
  const key=typeof dateOrKey==='string' ? dateOrKey : dateKeyJST(dateOrKey);
  return TIDES && TIDES.ports && TIDES.ports[portKey] ? TIDES.ports[portKey][key] || null : null;
}
function tideEventsForDay(portKey, dateOrKey){
  const key=typeof dateOrKey==='string' ? dateOrKey : dateKeyJST(dateOrKey), ck=`${portKey}|${key}`;
  if(PERF.tideDayEvents.has(ck)) return PERF.tideDayEvents.get(ck);
  const day=officialTideDay(portKey,key); if(!day){ PERF.tideDayEvents.set(ck,[]); return []; }
  const out=[];
  (day.high_tides||[]).forEach(e=>out.push({type:'PM', time:dateFromJST(key,e.time), height_cm:Number(e.height_cm)}));
  (day.low_tides||[]).forEach(e=>out.push({type:'BM', time:dateFromJST(key,e.time), height_cm:Number(e.height_cm)}));
  out.sort((a,b)=>a.time-b.time); PERF.tideDayEvents.set(ck,out); return out;
}
function surroundingTideEvents(portKey,date,range=2){
  const key=dateKeyJST(date), out=[];
  for(let i=-range;i<=range;i++) out.push(...tideEventsForDay(portKey,shiftDateKey(key,i)));
  return out.sort((a,b)=>a.time-b.time);
}
function tideBracket(portKey,date){
  const ck=`${portKey}|${date.getTime()}`;
  if(PERF.tideBracket.has(ck)) return PERF.tideBracket.get(ck);
  const ev=surroundingTideEvents(portKey,date,2);
  let prev=null,next=null;
  for(const e of ev){
    if(e.time<=date) prev=e;
    if(e.time>date){next=e;break;}
  }

}
function tideState(portKey,date){
  const {prev,next}=tideBracket(portKey,date);

  const near=Math.min(Math.abs(date-prev.time),Math.abs(next.time-date));
  if(near<=20*6e4) return 'étale';

  if(prev.type==='PM' && next.type==='BM') return 'descendante';

}
function tideHeight(portKey,date){
  const {prev,next}=tideBracket(portKey,date);
  if(!prev||!next || !Number.isFinite(prev.height_cm) || !Number.isFinite(next.height_cm)) return null;
  const span=next.time-prev.time; if(span<=0) return null;
  const p=Math.max(0,Math.min(1,(date-prev.time)/span));

/* Soleil calculé localement pour le repère de faible lumière.
   V5 ajoute les lueurs civiles : plus utiles au pêcheur que le seul lever/coucher. */
function sunEvent(lat,lng,date,isSunrise,zenith=90.833){
  const rad=Math.PI/180, deg=180/Math.PI;
  const p=jstParts(date), base=Date.UTC(p.y,p.m-1,p.d), jan0=Date.UTC(p.y,0,0);
  const day=Math.floor((base-jan0)/864e5), lngHour=lng/15;
  const t=day+((isSunrise?6:18)-lngHour)/24;
  const M=(0.9856*t)-3.289;
  let L=M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634; L=(L+360)%360;
  let RA=deg*Math.atan(0.91764*Math.tan(L*rad)); RA=(RA+360)%360;
  RA+=(Math.floor(L/90)*90)-(Math.floor(RA/90)*90); RA/=15;
  const sinDec=.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(zenith*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad));
  if(cosH>1||cosH<-1) return null;
  let H=isSunrise?360-deg*Math.acos(cosH):deg*Math.acos(cosH); H/=15;
  const T=H+RA-(0.06571*t)-6.622; let UT=(T-lngHour)%24; UT=(UT+24)%24;
  // NOAA renvoie ici une heure UTC modulo 24. Pour le Japon, l'aube tombe souvent
  // la veille en UTC : réaligner l'événement sur le jour civil JST demandé.
  let out=new Date(Date.UTC(p.y,p.m-1,p.d,Math.floor(UT),Math.round((UT%1)*60),0));
  const target=`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
  const got=dateKeyJST(out);
  if(got>target) out=new Date(out.getTime()-864e5);
  else if(got<target) out=new Date(out.getTime()+864e5);
  return out;
}
function sunTimes(lat,lng,date){
  const ck=`${lat}|${lng}|${dateKeyJST(date)}`;
  if(PERF.sunTimes.has(ck)) return PERF.sunTimes.get(ck);
  const out={
    civilDawn:sunEvent(lat,lng,date,true,96),
    sunrise:sunEvent(lat,lng,date,true,90.833),
    sunset:sunEvent(lat,lng,date,false,90.833),
    civilDusk:sunEvent(lat,lng,date,false,96),
  };
  PERF.sunTimes.set(ck,out); return out;
}

function idealWindows(portKey,date){
  const ck=`${portKey}|${dateKeyJST(date)}`;
  if(PERF.idealWindows.has(ck)) return PERF.idealWindows.get(ck);
  if(!officialTideDay(portKey,date)){ PERF.idealWindows.set(ck,[]); return []; }
  const p=PORTS[portKey]; if(!p||p.lat==null){ PERF.idealWindows.set(ck,[]); return []; }
  const sun=sunTimes(p.lat,p.lng,date), wins=[], zones=[];
  if(sun.sunrise) zones.push({label:'aube',center:sun.sunrise});
  if(sun.sunset) zones.push({label:'crépuscule',center:sun.sunset});
  for(const z of zones){
    const start=new Date(z.center.getTime()-54e5), end=new Date(z.center.getTime()+54e5);
    let curStart=null,curState=null;
    for(let t=start.getTime();t<=end.getTime();t+=15*6e4){
      const st=tideState(portKey,new Date(t));
      if(st && st!=='étale'){
        if(curState!==st){ if(curStart) wins.push({light:z.label,tide:curState,from:new Date(curStart),to:new Date(t)}); curStart=t;curState=st; }
      } else if(curStart){ wins.push({light:z.label,tide:curState,from:new Date(curStart),to:new Date(t)});curStart=null;curState=null; }
    }
    if(curStart) wins.push({light:z.label,tide:curState,from:new Date(curStart),to:end});

  const out=wins.filter(w=>(w.to-w.from)>=45*6e4); PERF.idealWindows.set(ck,out); return out;
}

/* Récurrence positive par espèce.
   Choix utilisateur assumé : on veut voir ce qui REVIENT dans les prises/rapports positifs.
   Pour éviter qu'une vidéo découpée en dix observations vote dix fois, une même source/date/heure/zone
   ne compte qu'une fois par moment ou phase. Ce n'est toujours pas un taux de succès. */
function observationPolarity(o){
  const sess=o&&o.metadata&&o.metadata.pwa_session;
  if(sess) return String(sess.result||'rien').toLowerCase()==='rien'?-1:1;
  const outcome=evNorm(o&&o.metadata&&o.metadata.outcome||'');
  // V6.5.5 — une touche ou un poisson décroché est un événement réel, mais jamais une
  // capture positive pour la récurrence. Le staging peut donc les conserver sans gonfler les fenêtres.
  if(['lost','bite','miss','missed','follow','refusal','nothing','no catch','no fish'].includes(outcome)) return -1;
  if(['catch','capture','positive'].includes(outcome)) return 1;
  const txt=evNorm([o&&o.text,o&&o.tags&&o.tags.comportement].filter(Boolean).join(' '));
  if(/sans prise|sans touche|absence de prise|aucune prise|aucune touche|aucun poisson|activite globalement faible|prises? (?:sont )?(?:jugees )?faibles?/.test(txt)) return -1;
  return 1;
}
function recurrenceEventKey(o,dim,value){
  const m=o.metadata||{};
  // V6.5.3 : un event_id curaté est prioritaire. Plusieurs faits/timestamps issus du même poisson
  // restent ainsi une seule voix positive. Les anciennes observations gardent le fallback historique.
  if(m.event_id) return [o.species,'event',m.event_id,dim,value].map(evNorm).join('¦');
  const date=[m.date,m.capture_date,m.date_reference,m.date_published].find(x=>typeof x==='string')||'';
  const time=typeof m.time==='string'?m.time:'';
  const zone=[m.zone,o.tags&&o.tags.zone,m.location].filter(Boolean).join('|');
  const src=String(o.source||o.source_type||'source'), url=String(m.source_url||'');
  return [o.species,src,url,date,time,zone,dim,value].map(evNorm).join('¦');
}
function bestMomentsBySpecies(){
  if(PERF.bestMoments) return PERF.bestMoments;
  const acc={}, seen=new Set(), raw={};
  DATA.observations.forEach(o=>{
    const mj=o.tags&&o.tags.moment_jour; if(!mj||observationPolarity(o)<0)return;
    const key=recurrenceEventKey(o,'moment_jour',mj); raw[o.species]=(raw[o.species]||0)+1;
    if(seen.has(key))return; seen.add(key);
    const sp=o.species; (acc[sp]=acc[sp]||{})[mj]=(acc[sp][mj]||0)+1;
  });
  const out={};
  Object.entries(acc).forEach(([sp,c])=>{
    const tot=Object.values(c).reduce((a,b)=>a+b,0);
    out[sp]=Object.entries(c).map(([m,n])=>({moment:m,pct:Math.round(100*n/tot),n,total:tot,rawObs:raw[sp]||tot}))
      .sort((a,b)=>b.pct-a.pct||b.n-a.n);
  });
  PERF.bestMoments=out; return out;
}
function tidePreferencesBySpecies(){
  if(PERF.tidePrefs) return PERF.tidePrefs;
  const acc={},seen=new Set();
  DATA.observations.forEach(o=>{
    const st=o.tags&&o.tags.maree;if(!st||observationPolarity(o)<0)return;
    const key=recurrenceEventKey(o,'maree',st);if(seen.has(key))return;seen.add(key);
    const sp=o.species;(acc[sp]=acc[sp]||{})[st]=(acc[sp][st]||0)+1;
  });

}
function tideRangeCm(portKey,key){
  const ev=tideEventsForDay(portKey,key).filter(e=>Number.isFinite(e.height_cm));
  if(ev.length<2) return 0;
  return Math.max(...ev.map(e=>e.height_cm))-Math.min(...ev.map(e=>e.height_cm));
}
function tideMovementIndex(portKey,date){
  const {prev,next}=tideBracket(portKey,date); if(!prev||!next) return 0;
  const span=next.time-prev.time; if(span<=0) return 0;
  const p=Math.max(0,Math.min(1,(date-prev.time)/span));

}

  const p=PORTS[portKey]; if(!p) return null;
  const d=dateFromJST(key,'12:00'), sun=sunTimes(p.lat,p.lng,d);
  if(moment==='aube') return sun.sunrise;

  if(moment==='jour' && sun.sunrise && sun.sunset) return new Date((sun.sunrise.getTime()+sun.sunset.getTime())/2);

}

  return arr.filter(k=>officialTideDay(s.port,k));
}
function tideDayScore(portKey,key,speciesList,stayDates){
  const ck=[portKey,key,(speciesList||[]).join(','),(stayDates||[]).join(',')].join('|');
  if(PERF.tideDayScore.has(ck)) return PERF.tideDayScore.get(ck);
  if(!officialTideDay(portKey,key)){ const out={score:null,label:'—',reason:'Pas de table officielle'}; PERF.tideDayScore.set(ck,out); return out; }
  const best=bestMomentsBySpecies(), prefs=tidePreferencesBySpecies();
  let wsum=0,mov=0,pref=0,bestEval=null;
  (speciesList||[]).forEach(sp=>{

    if(sample<2 || pt<1) return; // aucune préférence marée inventée si elle n'est pas documentée
    const moments=(best[sp]||[]).filter(x=>x.pct>=20).slice(0,3);
    moments.forEach(m=>{
      const t=momentCenter(portKey,key,m.moment); if(!t) return;
      const w=Math.max(.15,m.pct/100), mv=tideMovementIndex(portKey,t), st=tideState(portKey,t);

  }

  const phase=bestEval&&bestEval.st?bestEval.st:'phase inconnue';
  const level=bestEval?(bestEval.mv>=.7?'variation de niveau soutenue':bestEval.mv>=.4?'variation de niveau moyenne':'proche PM/BM'):'variation inconnue';
  const reason=bestEval?`${bestEval.moment} · ${phase} · ${level} · marnage ${Math.round(amp)} cm`:`marnage ${Math.round(amp)} cm`;
  const out={score,label,reason,movement:mov,preference:pref,amplitude:amp}; PERF.tideDayScore.set(ck,out); return out;
}

/* V6.3 — score horaire par espèce.
   C'est un INDICE RELATIF d'intérêt pour ordonner les créneaux, jamais une probabilité de capture.
   Il combine le signal moment_jour, la préférence de phase de marée, le mouvement de phase
   et un léger coefficient de pertinence locale/saisonnière issu du moteur de preuve V6.2. */
function momentAffinityAt(portKey,key,sp,time){
  const dist=bestMomentsBySpecies()[sp]||[];
  if(!dist.length) return {value:.5,dominant:null,rawPct:null};
  const total=dist[0]&&dist[0].total||dist.reduce((a,x)=>a+(x.n||0),0), support=Math.min(1,total/8), ref=dateFromJST(key,'12:00');
  const dens=dist.map(m=>{const r=momentRange(portKey,ref,m.moment);return {m,r,d:r?m.pct/Math.pow(Math.max(1,r[1]-r[0]),.35):0};});
  const maxDensity=Math.max(.01,...dens.map(x=>x.d));
  let sum=0,ws=0,dominant=null,dom=0;
  for(const x of dens){
    const m=x.m,r=x.r; if(!r) continue;
    let h=hrJST(time),a=r[0],b=r[1],inside=0;
    if(m.moment==='nuit'){ if(h<a) h+=24; inside=(h>=a&&h<=b)?1:0; }
    else inside=(h>=a&&h<=b)?1:0;
    if(!inside) continue;
    const center=(a+b)/2, half=Math.max(.75,(b-a)/2), d=Math.abs(h-center)/half;
    const shape=Math.max(.35,1-.45*d);
    const strength=(x.d/maxDensity)*shape;
    sum+=strength*m.pct; ws+=m.pct;
    if(strength>dom){dom=strength;dominant=m;}
  }
  if(!ws) return {value:.28,dominant:null,rawPct:null,total};
  const shaped=Math.max(.18,Math.min(1,sum/ws));
  const value=.48*(1-support)+shaped*support;
  return {value:Math.max(.22,Math.min(1,value)),dominant:dominant&&dominant.moment,rawPct:dominant&&dominant.pct,total};
}
function tideAffinityForSpecies(sp,state){
  const pc=tidePreferencesBySpecies()[sp]||{}, total=Object.values(pc).reduce((a,b)=>a+b,0);
  // Sans données marée propres à l'espèce : strictement neutre. Aucun a priori caché.
  if(!total||!state) return {value:.50,pct:null,count:0};
  const smoothed=(pc[state]||0)+1, denom=total+3;
  const raw=(pc[state]||0)/total, support=Math.min(1,total/8);
  const maxRaw=Math.max(...['montante','descendante','étale'].map(k=>(pc[k]||0)/total),.01);
  const shaped=Math.max(.28,Math.min(1,(smoothed/denom)/Math.max(maxRaw,.34)));
  return {value:.58*(1-support)+shaped*support,pct:Math.round(raw*100),count:total};
}
function movementAffinityForSpecies(sp,mv){
  const pc=tidePreferencesBySpecies()[sp]||{}, total=Object.values(pc).reduce((a,b)=>a+b,0);
  // Le niveau d'eau n'est PAS un courant. Et sans au moins 3 événements marée, pas d'a priori mouvement/extrema.
  if(total<3) return .50;
  const slack=(pc['étale']||0)/total;
  if(slack>=.45) return .45+.55*(1-mv);
  const moving=((pc['montante']||0)+(pc['descendante']||0))/total;
  const support=Math.min(1,total/8);
  const shaped=.50 + (mv-.50)*Math.max(0,Math.min(1,moving))*0.9;
  return .50*(1-support)+shaped*support;
}
function localWindowFactor(sp,stop){
