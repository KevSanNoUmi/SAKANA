const MOMENT_COLORS = {
  aube:       '#5FD3B2',   // turquoise clair
  jour:       '#6FB1D6',   // bleu clair
  crépuscule: '#7FB6C9',   // bleu-gris froid
  nuit:       '#3f5170',   // bleu nuit
};

/* Convertit un moment_jour en plage horaire [hDébut,hFin] pour un jour donné, à partir du soleil réel. */
function momentRange(portKey, date, moment){
  const ck=`${portKey}|${dateKeyJST(date)}|${moment}`;
  if(PERF.momentRange.has(ck)) return PERF.momentRange.get(ck);
  const p = PORTS[portKey]; if(!p||p.lat==null) return null;
  const sun = sunTimes(p.lat, p.lng, date);
  const hr = d => hrJST(d);
  const sr = hr(sun.sunrise), ss = hr(sun.sunset);
  if(sr==null||ss==null) return null;
  let out=null;
  switch(moment){
    case 'aube':       out=[sr-1, sr+1.5]; break;
    case 'crépuscule': out=[ss-1.5, ss+1]; break;
    case 'jour':       out=[sr+1.5, ss-1.5]; break;
    case 'nuit':       out=[ss+1, sr-1+24]; break; // traverse minuit
    default: out=null;
  }
  PERF.momentRange.set(ck,out); return out;
}

function tideCurveSVG(portKey, refDate, speciesFilter, stop=null){
  const base=refDate?new Date(refDate):new Date(), key=dateKeyJST(base), focus=tideFocusState(stop,key), targets=speciesFilter&&speciesFilter.length?speciesFilter:Object.keys(bestMomentsBySpecies()), priority=tidePrioritySpecies(portKey,key,targets,stop), emphasis=focus?focus.sp:priority, cacheKey=[portKey,key,targets.join(','),stop&&stop.id||'',emphasis||''].join('|');
  if(PERF.tideCurveHTML.has(cacheKey)) return PERF.tideCurveHTML.get(cacheKey);
  const day=officialTideDay(portKey,key);
  if(!day) return `<div class="tide-warning">Pas de table JMA embarquée pour ${escHTML(key)}. La V5 refuse volontairement d'inventer une courbe.</div>`;
  const dayStart=dateFromJST(key,'00:00'), pts=[];
  for(let m=0;m<=24*60;m+=15){
    const t=new Date(dayStart.getTime()+m*6e4), h=tideHeight(portKey,t);
    if(h!=null) pts.push([m,h]);
  }
  const ev=tideEventsForDay(portKey,key), values=pts.map(p=>p[1]).concat(ev.map(e=>e.height_cm)).filter(Number.isFinite);
  if(values.length<2) return `<div class="tide-warning">Données officielles insuffisantes pour tracer ce jour.</div>`;
  // V6.5.23 — rangées plus hautes : l'intensité est désormais portée par la hauteur des
  // barres, et à 10 px elle ne se lisait pas. 14 px laissent une amplitude exploitable.
  const bandRows=Math.min(6,targets.length), bandHeight=14, rowStep=17;
  const W=400,H=Math.max(120,92+bandRows*rowStep),topPad=10+bandRows*rowStep,min=Math.min(...values),max=Math.max(...values),span=max-min||1;
  const X=m=>m/(24*60)*W, Y=h=>H-14-(h-min)/span*(H-topPad-22), hourToX=hr=>X((((hr%24)+24)%24)*60);
  let path='',pen=false;
  for(const [m,h] of pts){ path+=`${pen?'L':'M'}${X(m).toFixed(1)},${Y(h).toFixed(1)} `; pen=true; }
  const p=PORTS[portKey], sun=(p&&p.lat!=null)?sunTimes(p.lat,p.lng,base):{};
  let lightBands='',sunLines='';
  ['aube','crépuscule'].forEach(mo=>{
    const r=momentRange(portKey,base,mo); if(!r)return;
    const x1=hourToX(r[0]),x2=hourToX(r[1]);
    lightBands+=`<rect x="${Math.min(x1,x2).toFixed(1)}" y="${topPad}" width="${Math.abs(x2-x1).toFixed(1)}" height="${H-topPad-10}" fill="${MOMENT_COLORS[mo]}" opacity="0.09"/>`;
  });
  if(sun.sunrise){const x=hourToX(hrJST(sun.sunrise));sunLines+=`<line x1="${x}" y1="${topPad}" x2="${x}" y2="${H-10}" stroke="${MOMENT_COLORS.aube}" stroke-width=".8" stroke-dasharray="2,2" vector-effect="non-scaling-stroke"/>`;}
  if(sun.sunset){const x=hourToX(hrJST(sun.sunset));sunLines+=`<line x1="${x}" y1="${topPad}" x2="${x}" y2="${H-10}" stroke="${MOMENT_COLORS['crépuscule']}" stroke-width=".8" stroke-dasharray="2,2" vector-effect="non-scaling-stroke"/>`;}

  let speciesBands='',row=0; const rowSpecies=[];
  targets.slice(0,6).forEach(sp=>{
    const series=speciesWindowSeries(portKey,key,sp,stop,30); if(!series.length)return;
    rowSpecies.push(sp);
    const y=2+row*rowStep, short=speciesWindowShort(sp), highlighted=sp===emphasis;
    const fill=highlighted?VIZ_EMPHASIS:VIZ_RECESSIVE, baseline=y+bandHeight;
    // L'intensité est portée par la hauteur (canal de longueur) et non plus par l'opacité,
    // qui s'effondre en plein soleil. L'opacité ne sert plus qu'au retrait des rangées.
    series.forEach((pt,i)=>{
      const x=X(i*30), w=Math.max(.8,X(30)-.7), h=Math.max(.7,Math.min(1,pt.score/108)*bandHeight);
      speciesBands+=`<rect x="${x.toFixed(1)}" y="${(baseline-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx=".8" fill="${fill}" opacity="${highlighted?'1':'.7'}"/>`;
    });
    // Ligne de base : sans un zéro visible, une hauteur ne se lit pas.
    speciesBands+=`<line x1="0" y1="${baseline}" x2="${W}" y2="${baseline}" stroke="${VIZ_RECESSIVE}" stroke-width=".5" opacity=".3" vector-effect="non-scaling-stroke"/>`;
    // Le texte porte de l'encre, jamais la couleur de série.
    speciesBands+=`<text x="2" y="${(y+bandHeight-1.4).toFixed(1)}" font-size="8" font-weight="${highlighted?'700':'500'}" fill="${highlighted?'#EDEEF0':'#94A0B0'}" stroke="#0F1720" stroke-width="2.4" paint-order="stroke" font-family="monospace">${escHTML(short)}</text>`;
    if(stop&&stop.id!=null) speciesBands+=`<rect x="0" y="${Math.max(0,y-1)}" width="${W}" height="${bandHeight+2}" fill="transparent" style="cursor:pointer" onclick="event.stopPropagation();focusTideSpecies(${stop.id},'${escAttr(portKey)}','${escAttr(key)}','${escAttr(sp)}')"><title>${escHTML(sp)} · toucher pour sélectionner, retoucher pour ouvrir le plan</title></rect>`;
    row++;
  });
  const markers=ev.map(e=>{
    const x=X((hrJST(e.time))*60),y=Y(e.height_cm),anchor=x<35?'start':x>365?'end':'middle';
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#00AE74" stroke="#172233" stroke-width="1.2"/><text x="${x.toFixed(1)}" y="${Math.max(topPad+9,y-7).toFixed(1)}" font-size="9" fill="#C3C9D2" text-anchor="${anchor}" font-family="monospace">${e.type} ${fmtJST(e.time)} · ${Math.round(e.height_cm)}cm</text>`;
  }).join('');
  const svg=`<svg class="tide-curve" tabindex="0" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de marée sur 24 h et fenêtres de prise par espèce. Appui long ou flèches gauche/droite pour lire les valeurs heure par heure." data-port="${escAttr(portKey)}" data-daykey="${escAttr(key)}" data-stop="${stop&&stop.id!=null?stop.id:''}" data-species="${escAttr(rowSpecies.join('|'))}" data-emphasis="${escAttr(emphasis||'')}" data-w="${W}">${lightBands}${sunLines}<path d="${path.trim()}" fill="none" stroke="#00AE74" stroke-width="1.8" vector-effect="non-scaling-stroke"/>${markers}${speciesBands}<text x="2" y="${H-2.5}" font-size="9" fill="#8B97A8" font-family="monospace">00h</text><text x="${W/2}" y="${H-2.5}" font-size="9" fill="#8B97A8" text-anchor="middle" font-family="monospace">12h</text><text x="${W-2}" y="${H-2.5}" font-size="9" fill="#8B97A8" text-anchor="end" font-family="monospace">24h JST</text></svg>`;
  const out=`<div class="tide-chart">${svg}<div class="tide-crosshair" aria-hidden="true"></div><div class="tide-readout" role="status" aria-live="polite"></div></div>`;
  PERF.tideCurveHTML.set(cacheKey,out); return out;
}

/* ===== V6.5.23 — lecture au doigt de la courbe de marée =====
   Le skill dataviz demande une couche de survol par défaut sur tout graphique HTML/SVG.
   Sur une app tactile l'équivalent est l'appui long : un réticule trouve le X et une
   seule infobulle liste toutes les séries à ce X — marée d'abord, puis chaque espèce.
   Elle enrichit sans conditionner : les mêmes valeurs restent lisibles sans elle dans
   les fiches de fenêtre en dessous. */
const TIDE_SCRUB_DELAY=420, TIDE_SCRUB_SLACK=10, TIDE_SLOTS=48;
let tideScrub=null, tideScrubPending=null, tideScrubEndedAt=0;

function tideScrubContext(svg){
  const id=svg.dataset.stop;
  return { port:svg.dataset.port, key:svg.dataset.daykey,
           stop:id!==''?tripPadById(Number(id)):null,
           species:(svg.dataset.species||'').split('|').filter(Boolean),
           emphasis:svg.dataset.emphasis||'' };
}
function tideReadoutRow(color,value,label){
  const row=document.createElement('div'); row.className='tide-readout-row';
  const k=document.createElement('span'); k.className='tide-readout-key'; k.style.background=color;
  const v=document.createElement('span'); v.className='tide-readout-val'; v.textContent=value;
  // Les noms d'espèce viennent des données : textContent, jamais de concaténation HTML.
  const l=document.createElement('span'); l.className='tide-readout-lab'; l.textContent=label;
  row.append(k,v,l); return row;
}
function tideScrubShow(chart,svg,slot){
  const ctx=tideScrubContext(svg), box=svg.getBoundingClientRect();
  if(!box.width) return;
  chart.classList.add('is-scrubbing'); chart.dataset.slot=String(slot);
  const cross=chart.querySelector('.tide-crosshair'), out=chart.querySelector('.tide-readout');
  // offsetLeft/offsetTop n'existent pas sur un SVGElement : ils valent undefined, la position
  // calculée devient NaN et le navigateur ignore l'affectation sans rien signaler.
  const cb=chart.getBoundingClientRect(), offX=box.left-cb.left, offY=box.top-cb.top;
  const left=offX+((slot+.5)/TIDE_SLOTS)*box.width;
  cross.style.left=`${left.toFixed(1)}px`; cross.style.top=`${offY.toFixed(1)}px`;
  cross.style.height=`${box.height.toFixed(1)}px`;
  const minutes=slot*30+15, t=new Date(dateFromJST(ctx.key,'00:00').getTime()+minutes*6e4);
  out.textContent='';
  const head=document.createElement('div'); head.className='tide-readout-time';
  head.textContent=`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')} JST`;
  out.appendChild(head);
  const h=tideHeight(ctx.port,t);
  out.appendChild(tideReadoutRow('#00AE74', h==null?'—':String(Math.round(h)), 'cm · marée'));
  ctx.species.forEach(sp=>{
    const serie=speciesWindowSeries(ctx.port,ctx.key,sp,ctx.stop,30), pt=serie&&serie[slot];
    const val=pt&&Number.isFinite(pt.score)?String(Math.round(pt.score)):'—';
    out.appendChild(tideReadoutRow(sp===ctx.emphasis?VIZ_EMPHASIS:VIZ_RECESSIVE, val, sp));
  });
  const w=out.offsetWidth||140; let rx=left+12;
  if(rx+w>offX+box.width) rx=left-12-w;
  out.style.left=`${Math.max(offX,Math.min(Math.max(offX,offX+box.width-w),rx)).toFixed(1)}px`;
  out.style.top=`${(offY+4).toFixed(1)}px`;
}
function tideScrubAt(chart,svg,clientX){
  const box=svg.getBoundingClientRect(); if(!box.width) return;
  const ratio=Math.max(0,Math.min(1,(clientX-box.left)/box.width));
  tideScrubShow(chart,svg,Math.max(0,Math.min(TIDE_SLOTS-1,Math.floor(ratio*TIDE_SLOTS))));
}
function tideScrubDropPending(){ if(tideScrubPending){clearTimeout(tideScrubPending.timer); tideScrubPending=null;} }
function tideScrubStop(){
  if(!tideScrub) return;
  tideScrub.chart.classList.remove('is-scrubbing');
  try{ tideScrub.svg.releasePointerCapture(tideScrub.pointerId); }catch(e){}
  tideScrub=null; tideScrubEndedAt=Date.now();
}
function installTideScrub(){
  if(document.body.dataset.tideScrub) return; document.body.dataset.tideScrub='1';
  document.addEventListener('pointerdown',e=>{
    const svg=e.target instanceof Element?e.target.closest('.tide-curve'):null; if(!svg) return;
    const chart=svg.closest('.tide-chart'); if(!chart) return;
    tideScrubDropPending();
    const x=e.clientX,y=e.clientY,id=e.pointerId;
    tideScrubPending={x,y,id,timer:setTimeout(()=>{
      tideScrubPending=null; tideScrub={chart,svg,pointerId:id};
      try{ svg.setPointerCapture(id); }catch(err){}
      try{ if(navigator.vibrate) navigator.vibrate(8); }catch(err){}
      tideScrubAt(chart,svg,x);
    },TIDE_SCRUB_DELAY)};
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(tideScrubPending&&e.pointerId===tideScrubPending.id){
      if(Math.abs(e.clientX-tideScrubPending.x)>TIDE_SCRUB_SLACK||Math.abs(e.clientY-tideScrubPending.y)>TIDE_SCRUB_SLACK) tideScrubDropPending();
      return;
    }
    if(tideScrub&&e.pointerId===tideScrub.pointerId) tideScrubAt(tideScrub.chart,tideScrub.svg,e.clientX);
  },{passive:true});
  ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,e=>{
    tideScrubDropPending();
    if(tideScrub&&e.pointerId===tideScrub.pointerId) tideScrubStop();
  },{passive:true}));
  // Un appui long ne doit pas déclencher la sélection de rangée qui suivrait le clic.
  document.addEventListener('click',e=>{
    if(Date.now()-tideScrubEndedAt<400&&e.target instanceof Element&&e.target.closest('.tide-chart')){
      e.stopPropagation(); e.preventDefault();
    }
  },true);
  // Mêmes valeurs au clavier qu'au doigt.
  document.addEventListener('keydown',e=>{
    const svg=document.activeElement;
    if(!(svg instanceof Element)||!svg.classList.contains('tide-curve')) return;
    const chart=svg.closest('.tide-chart'); if(!chart) return;
    if(e.key==='Escape'){ chart.classList.remove('is-scrubbing'); return; }
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
    e.preventDefault();
    const on=chart.classList.contains('is-scrubbing');
    const cur=on?Number(chart.dataset.slot||0):TIDE_SLOTS/2;
    tideScrubShow(chart,svg,Math.max(0,Math.min(TIDE_SLOTS-1,cur+(e.key==='ArrowRight'?1:-1))));
  });
}

/* Légende des tags couleur espèce×moment, pour une liste d'espèces ciblées */
function momentLegend(speciesList){
  const best = bestMomentsBySpecies();
  const rows = (speciesList||[]).map(sp=>{
    const arr = best[sp]; if(!arr||!arr.length) return '';
    const top = arr.filter(x=>x.pct>=10).slice(0,4);
    const tags = top.map(({moment,pct,n})=>`<span class="mom-tag" style="background:${MOMENT_COLORS[moment]}22;color:${MOMENT_COLORS[moment]};border-color:${MOMENT_COLORS[moment]}">${moment} ${pct}% · ${documentedCaseLabel(n||0,'cas')}</span>`).join(' ');
    return `<div class="mom-row"><span class="mom-sp">${escHTML(sp)}</span>${tags}</div>`;
  }).filter(Boolean).join('');
  return rows ? `<div class="mom-legend">${rows}</div>` : '';
}

/* ============ V6.5.1 PERFORMANCE ============
   Les données publiées sont immuables pendant une session. On indexe et mémoïse donc les
   agrégats coûteux (observations, preuves, soleil, marée, séries horaires). Cela évite de

const PERF={

  evidenceGroup:new Map(),strongestEvidence:new Map(),sourceHierarchy:new WeakMap(),dateValue:new WeakMap(),locationText:new WeakMap(),weight:new WeakMap(),gearStatus:new WeakMap()
};
function resetPerfCaches(){

  PERF.sourceHierarchy=new WeakMap(); PERF.dateValue=new WeakMap(); PERF.locationText=new WeakMap(); PERF.weight=new WeakMap(); PERF.gearStatus=new WeakMap();

}
const DECISION_MOMENTS=[null,'aube','jour','crépuscule','nuit'];
const DECISION_TIDES=[null,'montante','descendante','étale'];
function hydrateDecisionCache(cache){
  DECISION_CACHE=cache||{version:0,bestMoments:{},tidePrefs:{},series:{},daySummary:{},confidence:{}};
  PERF.bestMoments=DECISION_CACHE.bestMoments||{};
  PERF.tidePrefs=DECISION_CACHE.tidePrefs||{};
  for(const [k,v] of Object.entries(DECISION_CACHE.daySummary||{})){
    if(!v){PERF.daySummary.set(k,null);continue;}
    const [score,sp,from,to,avg,peak]=v;
    PERF.daySummary.set(k,{score,sp,window:from&&to?{from:new Date(from),to:new Date(to),avg,peak}:null});
  }
}
function decisionSeriesKey(portKey,key,sp,stop,stepMin=30){return [portKey,key,sp,stop&&stop.id||'',stepMin].join('|');}
function decisionSeriesReady(portKey,key,sp,stop,stepMin=30){return !!(DECISION_CACHE&&DECISION_CACHE.series&&DECISION_CACHE.series[decisionSeriesKey(portKey,key,sp,stop,stepMin)]);}
function hydratePackedDecisionSeries(portKey,key,sp,stop,stepMin=30){
  const ck=decisionSeriesKey(portKey,key,sp,stop,stepMin), packed=DECISION_CACHE&&DECISION_CACHE.series&&DECISION_CACHE.series[ck];
  if(!packed)return null;
  const start=dateFromJST(key,'00:00').getTime();

function findTypology(lure){
  const n=normalizeLure(lure); if(!n||n.length<4) return null;
  let best=null,bestLen=0;
  for(const [key,t] of Object.entries(LURETYPO||{})){
    const variants=[normalizeLure(key),normalizeLure(t&&t.modele)].filter(Boolean);
    for(const v of variants){ if(v.length>=4 && (n===v || n.includes(v) || v.includes(n)) && v.length>bestLen){best=t;bestLen=v.length;} }
  }
  return best;
}

function looksLikeNamedModel(lure){
  const text=String(lure||'').trim(); if(!text)return false;
  const code=/\b(?=[A-Za-z0-9-]*[A-Za-z])(?=[A-Za-z0-9-]*\d)[A-Za-z0-9-]{3,}\b/g; let m;
  while((m=code.exec(text))){ const tail=text.slice(m.index+m[0].length,m.index+m[0].length+4).toLowerCase(); if(!/^\s*(g|cm|mm)\b/.test(tail))return true; }

  const tokens=text.match(/[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ0-9-]*/g)||[];
  return tokens.some(tok=>!allowed.has(tok)&&tok.length>2&&tok[0]===tok[0].toUpperCase()&&tok!==tok.toUpperCase());
}
function isGenericLureName(lure){
  const text=String(lure||'').trim(); if(!text)return false;
  const m=text.match(/^(metal jig|blade jig|casting jig|jig|sinking pencil|diving pencil|pencil bait|stickbait|wakebait|minnow|jerkbait|popper|topwater|egi|souple|soft bait|vibration|blade lure|tenya|jighead|t[eê]te plomb[eé]e)\b/i);
  if(m){
    const rest=text.slice(m[0].length).replace(/^[\s\-–—/:;,.]+/,'');
    if(!rest||/^(de\b|d['’]environ\b|avec\b|sur\b|en\b|ou\b|pour\b|type\b|compact\b|l[eé]ger\b|lourd\b|pr[eé]voir\b|[0-9]+(?:[.,][0-9]+)?\s*(g|cm|mm|号)\b)/i.test(rest))return true;
    return !looksLikeNamedModel(rest);

function recommendationGearStatus(o){

    if(gf.reason==='model_weight_unknown') return done('UNKNOWN_WEIGHT_MODEL');
    return done('VERIFIED_OVER_LIMIT');
  }
  if(r.gear_status) return done(r.gear_status);
  if(tp.gear_status) return done(tp.gear_status);
  if(tp.allowed_for_user===false) return done('VERIFIED_OVER_LIMIT');
  const w=recommendationWeight(o);
  if(w!==null) return done(w<=maxLureWeight()?'VERIFIED_OK':'VERIFIED_OVER_LIMIT');

function closeUXSheet(){
  const back=document.getElementById('uxBackdrop');
  document.body.style.overflow='';
  const target=uxSheetReturnFocus; uxSheetReturnFocus=null;
  if(target&&document.contains(target)) requestAnimationFrame(()=>target.focus({preventScroll:true}));
  if(!back)return;
  back.classList.remove('is-open');
  if(REDUCE_MOTION.matches){ back.classList.remove('open'); return; }
  let done=false;
  const hide=()=>{ if(done)return; done=true;

  back.addEventListener('transitionend',hide,{once:true});
  setTimeout(hide,360);
}

const GLOSSARY={
  'étale':{label:'Étale',def:'Période autour d’un haut ou d’un bas de marée pendant laquelle le niveau d’eau varie peu. Le courant réel d’un spot peut ralentir ou se décaler par rapport à l’étale de hauteur.'},
  'pe':{label:'PE',def:'Notation japonaise de taille de ligne, très utilisée pour les tresses. Elle désigne une classe normalisée de section ; le diamètre réel annoncé peut varier selon la construction et le fabricant.'},
  'twitch':{label:'Twitch',def:'Petite impulsion brève du scion destinée à faire dévier ou accélérer ponctuellement le leurre.'},
  'jerk':{label:'Jerk',def:'Impulsion de canne plus ample qu’un twitch, utilisée pour provoquer un écart, une accélération ou un changement marqué d’attitude du leurre.'},
  'one-pitch':{label:'One-pitch',def:'Cadence de jigging où les animations de canne et la récupération au moulinet sont synchronisées de façon régulière.'},
  'lift-and-fall':{label:'Lift-and-fall',def:'Animation qui alterne une remontée du leurre puis une phase de retombée, libre ou contrôlée.'},
  'free fall':{label:'Free fall',def:'Descente du leurre avec très peu de tension de ligne afin de laisser la gravité et l’hydrodynamique produire la chute.'},
  'dead slow':{label:'Dead slow',def:'Récupération continue volontairement très lente, sans accélérations marquées.'},
  'dog-walk':{label:'Dog-walk',def:'Animation en zigzag latéral obtenue par une succession d’impulsions et de reprises de mou, souvent utilisée en surface.'},
  'slack':{label:'Slack',def:'Mou dans la ligne. Il peut être volontaire pour libérer une animation ou une chute, mais réduit momentanément le contact direct avec le leurre.'}
};
function openGlossary(key){
  const g=GLOSSARY[key]; if(!g)return;
  openUXSheet(g.label,'Glossaire terrain',`<div class="glossary-definition">${escHTML(g.def)}</div><div class="glossary-warning">Définition de lecture rapide : elle n’altère ni les preuves ni les calculs du carnet.</div>`+densityControlHTML());
}
function decorateGlossary(root=document.getElementById('mainZone')){
  if(!root)return;
  const aliases=Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length), esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const rx=new RegExp(`(^|[^\\p{L}\\p{N}])(${aliases.map(esc).join('|')})(?![\\p{L}\\p{N}])`,'giu');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[];
  while(walker.nextNode()){
    const n=walker.currentNode,p=n.parentElement; if(!p||!n.nodeValue.trim())continue;
    if(p.closest('button,a,input,textarea,select,option,code,pre,script,style,.raw-source,.glossary-term'))continue;
    rx.lastIndex=0; if(rx.test(n.nodeValue))nodes.push(n);
  }
  for(const n of nodes){
    const txt=n.nodeValue, frag=document.createDocumentFragment(); let last=0; rx.lastIndex=0; let m;
    while((m=rx.exec(txt))){
      const start=m.index, lead=m[1]||'', term=m[2];
      if(start>last)frag.appendChild(document.createTextNode(txt.slice(last,start)));
      if(lead)frag.appendChild(document.createTextNode(lead));
      const key=term.toLowerCase(), b=document.createElement('button'); b.type='button'; b.className='glossary-term'; b.textContent=term; b.setAttribute('aria-label',`${term} — définition`); b.addEventListener('click',e=>{e.stopPropagation();openGlossary(key);}); frag.appendChild(b);
      last=start+m[0].length;
    }
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    n.replaceWith(frag);
  }
}

function mapStopLabel(city){ return String(city||'').replace(/\s*\(.+?\)\s*/g,'').split('/')[0].trim(); }
function tripGeoMapHTML(stops){
  const pts=stops.map(s=>({s,p:PORTS[s.port]})).filter(x=>x.p&&Number.isFinite(x.p.lat)&&Number.isFinite(x.p.lng));
  if(!pts.length)return '<div class="empty">Aucune coordonnée de port disponible.</div>';
  // Vue centrée sur l'itinéraire Kyushu → Kanto, avec silhouette du Japon embarquée.
  // Aucun fond réseau : la carte reste utile hors-ligne.
  const W=720,H=480,minLng=128.6,maxLng=142.3,minLat=30.3,maxLat=40.8,pad=18;
  const X=lng=>pad+(lng-minLng)/(maxLng-minLng)*(W-2*pad),Y=lat=>H-pad-(lat-minLat)/(maxLat-minLat)*(H-2*pad);
  const project=([lng,lat])=>[X(lng),Y(lat)];
  const land=JAPAN_MAP_POLYGONS.map(poly=>{
    const d=poly.map((pt,i)=>{const [x,y]=project(pt);return `${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`;}).join(' ')+' Z';
    return `<path class="trip-map-land" d="${d}"/>`;
  }).join('');
  const grid=[.25,.5,.75].map(f=>`<line class="trip-map-sea-grid" x1="${pad}" y1="${(pad+f*(H-2*pad)).toFixed(1)}" x2="${W-pad}" y2="${(pad+f*(H-2*pad)).toFixed(1)}"/><line class="trip-map-sea-grid" x1="${(pad+f*(W-2*pad)).toFixed(1)}" y1="${pad}" x2="${(pad+f*(W-2*pad)).toFixed(1)}" y2="${H-pad}"/>`).join('');
  const mapped=pts.map((x,i)=>({...x,i,x:X(x.p.lng),y:Y(x.p.lat),dx:0,dy:0}));
  // Le décalage tactile est calculé après montage par spreadTripMapPins() : il a besoin de la
  // taille réelle des pastilles en pixels, que le viewBox 720×480 ne permet pas de connaître ici.
  const route=mapped.map(x=>`${x.x.toFixed(1)},${x.y.toFixed(1)}`).join(' ');
  const pins=mapped.map((x,i)=>{
    const match=stopMatchesFocus(x.s),classes=[i===0?'start':'',i===mapped.length-1?'end':'',focusSpeciesName?(match?'focus-hit':'focus-miss'):''].filter(Boolean).join(' ');
    return `<button type="button" class="trip-map-pin ${classes}" style="left:${(100*x.x/W).toFixed(2)}%;top:${(100*x.y/H).toFixed(2)}%;--pin-dx:${x.dx}px;--pin-dy:${x.dy}px" onclick="openQuickPeek('stop',${x.s.id})" aria-label="Étape ${i+1} — ${escAttr(mapStopLabel(x.s.city))}, ${escAttr(x.s.dates||'')}">${i+1}</button>`;
  }).join('');
  const list=mapped.map((x,i)=>`<button type="button" class="trip-map-link ${focusSpeciesName?(stopMatchesFocus(x.s)?'focus-hit':'focus-miss'):''}" onclick="openQuickPeek('stop',${x.s.id})"><strong>${i+1}</strong>${escHTML(mapStopLabel(x.s.city))}<span>${escHTML(x.s.dates||'')}</span></button>`).join('');
  return `<div class="trip-map-wrap"><div class="trip-map-head"><div><div class="trip-map-title">Trajet au Japon</div><div class="trip-map-note">Silhouette géographique simplifiée embarquée ; étapes projetées depuis les coordonnées des ports JMA. Touchez un numéro pour ouvrir l’étape. Ce n’est pas une carte nautique.</div></div></div><div class="trip-map-canvas"><svg class="trip-map" viewBox="0 0 ${W} ${H}" aria-hidden="true" preserveAspectRatio="none">${grid}${land}<polyline class="trip-map-path-halo" points="${route}"/><polyline class="trip-map-path" points="${route}"/></svg><div class="trip-map-compass">N ↑</div>${pins}</div><div class="trip-map-list">${list}</div></div>`;
}
/* V6.5.23 — écarte les pastilles d'étape qui se chevauchent. L'ancienne passe comparait des
   distances en unités de viewBox (720×480) à un seuil de 30, soit ~14 px réels sur mobile,
   alors qu'une pastille fait 44 px : elle ne se déclenchait presque jamais, et son `break`
   ne traitait que des paires — d'où l'amas des étapes 5-6-7. On relaxe ici en pixels réels,
   toutes paires confondues, en gardant les pastilles dans le cadre. */
function spreadTripMapPins(){
  const canvas=document.querySelector('.trip-map-canvas'); if(!canvas)return;
  const pins=[...canvas.querySelectorAll('.trip-map-pin')]; if(pins.length<2)return;
  const cw=canvas.clientWidth, ch=canvas.clientHeight; if(!cw||!ch)return;
  const taille=pins[0].offsetWidth||44, ecart=taille+4, r=taille/2;
  const n=pins.map(el=>{ const bx=parseFloat(el.style.left)/100*cw, by=parseFloat(el.style.top)/100*ch;
                         return {el,bx,by,x:bx,y:by}; });
  for(let iter=0;iter<80;iter++){
    let bouge=false;
    for(let i=0;i<n.length;i++) for(let j=i+1;j<n.length;j++){
      const a=n[i], b=n[j];
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if(d>=ecart) continue;
      if(d<0.01){ dx=0; dy=1; d=1; }                 // pastilles exactement superposées
      const pousse=(ecart-d)/2/d;
      a.x-=dx*pousse; a.y-=dy*pousse; b.x+=dx*pousse; b.y+=dy*pousse;
      bouge=true;
    }
    n.forEach(p=>{ p.x=Math.max(r,Math.min(cw-r,p.x)); p.y=Math.max(r,Math.min(ch-r,p.y)); });
    if(!bouge) break;
  }
  n.forEach(p=>{ p.el.style.setProperty('--pin-dx',`${(p.x-p.bx).toFixed(1)}px`);
                 p.el.style.setProperty('--pin-dy',`${(p.y-p.by).toFixed(1)}px`); });
}

/* V6.5.23 — la progression est écrite en transform directement sur la barre (plus de
   variable CSS sur le parent, qui recalculait le style de tous ses descendants) et le
   handler de scroll est throttlé : une seule mesure + une seule écriture par frame,
   au lieu d'une par événement de scroll. */
function updateSpeciesRailProgress(){
  const rail=document.getElementById('speciesRail'); if(!rail||!currentSpeciesId)return;
  const fill=rail.querySelector('.species-rail-fill'); if(!fill)return;
  const panel=document.getElementById('tabPanel'); if(!panel)return;

function isSwipeBlocked(target){ return !!target.closest('button,a,input,textarea,select,summary,.tide-days,.species-tabs,.relation-pills,.ux-sheet,.trip-map-node,.tide-chart'); }
/* ===== V6.5.23 — balayage repensé selon le skill apple-design =====
   L'ancienne version n'écoutait que touchstart/touchend et décidait sur la seule distance
   (72 px) : aucun retour pendant le geste, et un flick rapide mais court ne déclenchait
   rien. C'est le « recognizer qui ne rapporte qu'un état final » que le skill dit d'éviter,
   parce qu'il jette le suivi continu dont dépend le retour visuel.
   Ici : suivi 1:1 amorti (§2, §9), vitesse mesurée sur les derniers points (§5), et
   projection du point d'arrivée par la fonction exacte d'Apple (§6). */
/* SWIPE_DECEL : 0.998 est le taux du défilement inertiel, calibré pour parcourir de longues
   distances. Sur une décision discrète (changer d'onglet) il projette trop loin — un
   glissement mou de 40 px basculait l'onglet. 0.99, la variante « snappier » du skill,
   donne ~0.10·v au lieu de ~0.50·v : le flick passe, la traîne non. */
const SWIPE_MIN=72, SWIPE_LOCK=10, SWIPE_DECEL=0.99;
// Projection de l'inertie : décroissance exponentielle, pas la formule v²/(2a) des manuels.
function swipeProject(v){ return (v/1000)*SWIPE_DECEL/(1-SWIPE_DECEL); }
// Résistance progressive en butée : les choses réelles ralentissent avant de s'arrêter.
function rubberband(over,dim,k=0.55){ return (over*dim*k)/(dim+k*Math.abs(over)); }
function swipeLiveX(el){
  const m=new DOMMatrixReadOnly(getComputedStyle(el).transform); return m.m41||0;
}
function installSwipeNavigation(){
  const root=document.getElementById('mainZone'); if(!root||root.dataset.swipeInstalled)return; root.dataset.swipeInstalled='1';
  root.addEventListener('pointerdown',e=>{
    if(!e.isPrimary||isSwipeBlocked(e.target))return;
    let panel=null,kind=null;
    if(location.hash.startsWith('#species/')&&e.target.closest('#tabPanel')){panel=document.getElementById('tabPanel');kind='tab';}
    else if(!location.hash&&openStopId!=null&&e.target.closest(`#stopDetail-${openStopId}`)){panel=document.getElementById(`stopDetail-${openStopId}`);kind='day';}
    if(!panel)return;
    // On repart de la valeur affichée, jamais de la valeur cible : sinon un geste
    // repris pendant le retour élastique provoque un saut visible.
    panel.classList.remove('swipe-settling');
    swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId,panel,kind,axis:null,
                baseX:swipeLiveX(panel),hist:[{x:e.clientX,t:performance.now()}]};
  },{passive:true});

  root.addEventListener('pointermove',e=>{
    const st=swipeStart; if(!st||e.pointerId!==st.id)return;
    const dx=e.clientX-st.x, dy=e.clientY-st.y;
    st.hist.push({x:e.clientX,t:performance.now()});
    if(st.hist.length>6)st.hist.shift();
    // Verrou d'axe après ~10 px : on décide une fois, puis on suit.
    if(!st.axis){
      if(Math.abs(dx)<SWIPE_LOCK&&Math.abs(dy)<SWIPE_LOCK)return;
      st.axis=Math.abs(dx)>Math.abs(dy)*1.25?'x':'y';
      if(st.axis==='x')try{st.panel.setPointerCapture(e.pointerId);}catch(err){}
    }
    if(st.axis!=='x')return;
    if(REDUCE_MOTION.matches)return;   // mouvement réduit : pas de suivi de position
    // Résistance plus forte quand il n'y a rien de l'autre côté.
    const k=swipeHasNeighbour(st.kind,dx<0?1:-1)?0.55:0.22;
    st.panel.style.transform=`translateX(${(st.baseX+rubberband(dx,st.panel.offsetWidth||320,k)).toFixed(1)}px)`;
  },{passive:true});

  const finish=e=>{
    const st=swipeStart; if(!st||e.pointerId!==st.id)return; swipeStart=null;
    const panel=st.panel;
    panel.classList.add('swipe-settling'); panel.style.transform='';
    try{panel.releasePointerCapture(st.id);}catch(err){}
    if(st.axis!=='x'||e.type!=='pointerup')return;
    const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(Math.abs(dy)>90)return;
    // Vitesse sur les derniers points, pas de bout en bout : un flick qui démarre
    // lentement serait sous-estimé par une moyenne sur tout le geste.
    const h=st.hist, a=h[0], b=h[h.length-1], ms=Math.max(1,b.t-a.t);
    const v=(b.x-a.x)/ms*1000;
    // On décide sur le point d'arrivée projeté, pas sur le point de relâchement.
    const reach=dx+swipeProject(v);
    if(Math.abs(reach)<SWIPE_MIN||Math.sign(reach)!==Math.sign(dx||reach))return;
    swipeCommit(st.kind,reach<0?1:-1);
  };
  root.addEventListener('pointerup',finish,{passive:true});
  root.addEventListener('pointercancel',finish,{passive:true});
}
function swipeHasNeighbour(kind,dir){
  if(kind==='tab'){const n=speciesTab+dir;return n>=0&&n<SPECIES_TABS.length;}
  const stop=tripPadById(openStopId),days=stop?stayDatesForStop(stop):[];
  const n=Math.max(0,Math.min(days.length-1,Number(tideDayByStop[openStopId]||0)))+dir;
  return n>=0&&n<days.length;
}
function swipeCommit(kind,dir){
  if(kind==='tab'){
    const next=speciesTab+dir;
    if(next>=0&&next<SPECIES_TABS.length){setSpeciesTab(next);flashSwipe(SPECIES_TABS[next]);}
    return;
  }
  const stop=tripPadById(openStopId),days=stop?stayDatesForStop(stop):[];
  const idx=Math.max(0,Math.min(days.length-1,Number(tideDayByStop[openStopId]||0))),next=idx+dir;
  if(next>=0&&next<days.length){setTideDay(openStopId,next);flashSwipe(shortDayLabel(days[next]));}
}

function briefMd(s){
  // Échappe d'abord le contenu, puis applique un sous-ensemble markdown maîtrisé.
  const safe=escHTML(s||'').replace(/\[#(\d+)\]/g,'<span class="obs-ref">[#$1]</span>');
  const lines=safe.split('\n'); let html='',inList=false;
  for(let ln of lines){
    if(/^##\s+/.test(ln)){if(inList){html+='</ul>';inList=false;}html+=`<div class="brief-h">${ln.replace(/^##\s+/,'')}</div>`;}
    else if(/^#\s+/.test(ln)){if(inList){html+='</ul>';inList=false;}html+=`<div class="brief-h1">${ln.replace(/^#\s+/,'')}</div>`;}
    else if(/^-\s+/.test(ln)){if(!inList){html+='<ul class="brief-ul">';inList=true;}html+=`<li>${ln.replace(/^-\s+/,'').replace(/\*(.+?)\*/g,'<em>$1</em>')}</li>`;}
    else if(ln.trim()===''){if(inList){html+='</ul>';inList=false;}}
    else{if(inList){html+='</ul>';inList=false;}html+=`<p>${ln.replace(/\*(.+?)\*/g,'<em>$1</em>')}</p>`;}
  }
  if(inList)html+='</ul>'; return html;
}

function stopDecisionReady(stopId){

  const targets=(stop.target_species&&stop.target_species.length)?stop.target_species:Object.keys(bestMomentsBySpecies());

function rerenderStopDetail(stopId,defer=false,scrollPlan=false){

  const ready=stopDecisionReady(stopId);

function warmStopDaySummaries(stopId){
  const stop=tripPadById(stopId); if(!stop||stop._perfWarmScheduled||stop._perfWarmDone)return;
  const days=stayDatesForStop(stop),targets=(stop.target_species&&stop.target_species.length)?stop.target_species:Object.keys(bestMomentsBySpecies());
  if(days.every(k=>peekBestWindowDaySummary(stop.port,k,targets,stop))){stop._perfWarmDone=true;return;}
  stop._perfWarmScheduled=true; let i=0;
  const step=()=>{
    while(i<days.length&&peekBestWindowDaySummary(stop.port,days[i],targets,stop))i++;
    if(i>=days.length){stop._perfWarmScheduled=false;stop._perfWarmDone=true;return;}
    const key=days[i++]; bestWindowDaySummary(stop.port,key,targets,stop); perfIdle(step);
  };

}
function toggleStop(id){

function activeEvidenceStop(){ const p=getActivePort(); return p ? tripPadStops().find(s=>s.port===p)||null : null; }

function evidenceSourceHierarchy(o){

  if(/yamashita|yamaria|maria\b/.test(hay)){platform=/yamashita/.test(hay)?'yamashita':/maria\b/.test(hay)?'maria':'yamaria';group='yamaria';}
  else if(/anglers\.jp|\banglers\b/.test(hay)){platform='anglers.jp';group='anglers.jp';}

  // Sinon le label historique reste le fallback (compatibilité V6.5.2).

function evidenceOrigin(o){ return evidenceSourceHierarchy(o).group; }
function evidenceSourceIdentity(o){ return evidenceSourceHierarchy(o).author; }
function isPersonalEvidence(o){ return !!(o&&o.metadata&&o.metadata.pwa_session); }
function evidenceDateValue(o){
  if(o&&PERF.dateValue.has(o)) return PERF.dateValue.get(o);
  const m=o&&o.metadata||{}, candidates=[m.date,m.capture_date,m.date_reference,m.date_published];
  for(const x of candidates){ if(typeof x==='string' && /^\d{4}-\d{2}-\d{2}/.test(x)){const out=x.slice(0,10);if(o)PERF.dateValue.set(o,out);return out;} }
  if(o)PERF.dateValue.set(o,null); return null;

function calendarDistance(a,b){
  if(!a||!b) return null;
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number); if(pa.length<3||pb.length<3) return null;
  const da=Date.UTC(2000,pa[1]-1,pa[2]), db=Date.UTC(2000,pb[1]-1,pb[2]);
  const d=Math.abs(da-db)/86400000; return Math.min(d,366-d);

function evidenceLocationText(o){
  if(o&&PERF.locationText.has(o)) return PERF.locationText.get(o);
  const m=o&&o.metadata||{}, out=evNorm([m.zone,o.tags&&o.tags.zone,m.location,m.reference_location,o.tags&&o.tags.spot_type].filter(Boolean).join(' '));
  if(o)PERF.locationText.set(o,out); return out;

function evidenceLocalityScore(o,stop){
  if(isPersonalEvidence(o)){
    const ps=o.metadata&&o.metadata.pwa_session&&o.metadata.pwa_session.port;
    if(stop&&ps===stop.port) return 5;
  }
  const m=o.metadata||{}, zone=evidenceLocationText(o), sr=evNorm(m.shore_relevance||'');
  if(stop){
    const r=EVIDENCE_LOCATION_RULES[stop.port]||{exact:[],area:[],regional:[]};
    if(zone && (r.exact||[]).some(a=>zone.includes(evNorm(a)))) return 5;
    if(zone && (r.area||[]).some(a=>zone.includes(evNorm(a)))) return 4;
    if(zone && (r.regional||[]).some(a=>zone.includes(evNorm(a)))) return 2.5;
    if(sr.includes('direct area')||sr.includes('direct shore')||sr.includes('direct local')) return 3;
    if(sr.includes('regional')) return 2;
    return zone?1.5:1;
  }
  if(sr.includes('direct area')||sr.includes('direct shore')||sr.includes('direct local')) return 4;
  if(sr.includes('local')) return 3;
  if(sr.includes('regional')) return 2;
  return zone?2:1;
}
function evidenceSeasonScore(o,stop){
  const d=evidenceDateValue(o);
  if(stop&&d&&(stop.stay_dates||[]).length){
    const vals=stop.stay_dates.map(x=>calendarDistance(d,x)).filter(x=>x!==null), dd=vals.length?Math.min(...vals):null;
    if(dd!==null){ if(dd<=3)return 5; if(dd<=10)return 4.5; if(dd<=31)return 3.5; if(dd<=60)return 2.5; return 1; }
  }
  if(d){ const md=d.slice(5,7); return (md==='11'||md==='12')?4:2; }
  const season=evNorm(o.tags&&o.tags.saison||'');
  if(season.includes('novembre')||season.includes('decembre')||season==='hiver') return 3;
  if(season==='general') return 2.5;
  return 2;
}
function evidenceRecencyScore(o,stop){
  const d=evidenceDateValue(o); if(!d)return 2.5;
  const y=Number(d.slice(0,4));
  const tripYears=(stop&&stop.stay_dates||[]).map(x=>Number(String(x).slice(0,4))).filter(Number.isFinite);
  const ref=tripYears.length?Math.max(...tripYears):2026, age=Math.max(0,ref-y);
  if(age<=1)return 5; if(age===2)return 4.25; if(age<=4)return 3.25; if(age<=7)return 2.5; return 1.5;
}
function evidenceDirectScore(o,facet='presence'){
  if(isPersonalEvidence(o)) return 5;
  const et=String(o.metadata&&o.metadata.evidence_type||'').toUpperCase(), st=String(o.source_type||'').toLowerCase();
  if(st==='official_regulation') return facet==='presence'?1:2;
  if(et.includes('OFFICIAL')) return (facet==='presence'||facet==='timing')?4:3;
  if(et.includes('OBSERVED') && (st.includes('catch')||st==='terrain')) return 5;
  if(et.includes('OBSERVED_LOCAL_SHOP')||et.includes('OBSERVED_PLUS_LOCAL_SHOP')||et.includes('OBSERVED/DECLARED')) return 4;
  if(st==='catch_log'||st==='catch_report'||st==='regional_catch_log') return 5;
  if(st.includes('local_shop')) return 4;
  if(st==='marque') return (facet==='lure'||facet==='animation')?5:(facet==='color'?3:1);
  if(st==='video') return (facet==='lure'||facet==='animation')?4:3;
  if(st==='blog') return 3;
  // Le vieux confidence_score n'est plus utilisé pour fabriquer une pseudo-preuve.
  return 2;
}
function evidenceSetupScore(o){
  const st=recommendationGearStatus(o);
  if(st==='VERIFIED_OVER_LIMIT') return 1;
  if(st==='UNKNOWN_WEIGHT_MODEL') return 2;
  const w=recommendationWeight(o);

  return 5;
}
function evidenceQuality(v){ return v>=4.3?'very':v>=3.3?'solid':v>=2.3?'signal':'hyp'; }
function evidenceBadge(label,extra=''){ const x=EVIDENCE_LABELS[label]||EVIDENCE_LABELS.hyp; return `<span class="ev-badge ${x.cls}"><span class="ev-dot"></span>${x.label}${extra?` · ${escHTML(extra)}`:''}</span>`; }
function personalBadge(n){ return n?`<span class="ev-badge personal"><span class="ev-dot"></span>VALIDÉ PAR TOI${n>1?` ×${n}`:''}</span>`:''; }
function lureEvidenceKey(o){
  const r=o.recommendation||{}, tp=r.typology||{}; if(tp.famille) return evNorm(tp.famille);
  const s=evNorm(r.lure||o.tags&&o.tags.leurre||''); if(!s)return null;
  const keys=['sinking pencil','diving pencil','metal jig','blade jig','minnow','jerkbait','egi','popper','topwater','vibration','souple','soft bait','tenya'];
  return keys.find(k=>s.includes(k))||s.split(' ').slice(0,4).join(' ');
}
function colorEvidenceKey(o){
  const s=evNorm(o.recommendation&&o.recommendation.color||''); if(!s)return null;
  const groups=[['ghost','transparent','translucide'],['pearl','blanc','white','opaque'],['chart','chartreuse','jaune','yellow'],['rose','pink','magenta'],['orange'],['glow','phospho','night glow'],['uv','keimura'],['silver','argent','iwashi','sardine','natural','naturel'],['gold','or'],['red','rouge'],['dark','sombre','black','noir']];

function evidenceKey(o,facet){
  if(facet==='presence') return 'presence';
  if(facet==='timing') return [o.tags&&o.tags.moment_jour,o.tags&&o.tags.maree].filter(Boolean).map(evNorm).join('|')||null;
  if(facet==='lure') return lureEvidenceKey(o);
  if(facet==='animation') return actionCategory(o)||null;

function evidenceCandidates(spId,facet,key,stop){

  if(facet==='presence') arr=arr.filter(o=>!(o.metadata&&o.metadata.exclude_presence_evidence) && evidenceDirectScore(o,'presence')>=3 && (evidenceDateValue(o)||evidenceLocationText(o)));
  else arr=technicalObservations(arr).filter(o=>evidenceKey(o,facet)===key);

    const local=arr.filter(o=>evidenceLocalityScore(o,stop)>=4);

function evidenceEventIdentity(o,facet,key){

  if(m.event_id) return [h.author,'event',m.event_id,facet,key||''].map(evNorm).join('¦');
  const date=evidenceDateValue(o)||'', time=m.time||m.time_bites_start||'', zone=evidenceLocationText(o);

function evidenceGroup(spId,facet,key=null,stop=activeEvidenceStop()){
  const ck=[spId,facet,key||'',stop&&stop.id||stop&&stop.port||'global'].join('|');
  if(PERF.evidenceGroup.has(ck)) return PERF.evidenceGroup.get(ck);
  const raw=evidenceCandidates(spId,facet,key,stop); if(!raw.length){PERF.evidenceGroup.set(ck,null);return null;}
  // Un même événement découpé en plusieurs phrases ne crée pas plusieurs voix.
  const seen=new Set(),arr=[];
  raw.forEach(o=>{const ek=evidenceEventIdentity(o,facet,key);if(!seen.has(ek)){seen.add(ek);arr.push(o);}});
  const authors=new Set(),platforms=new Set(),groups=new Set();
  arr.forEach(o=>{const h=evidenceSourceHierarchy(o);authors.add(h.author);platforms.add(h.platform);groups.add(h.group);});
  const personal=arr.filter(isPersonalEvidence).length;
  let rep=1;

  else if(authors.size>=3&&(platforms.size>=2||groups.size>=2))rep=4;

/* ===== Croisement conditionnel : ÉTAT du poisson × réaction du pêcheur (prototype Aori-Ika) =====
   4 états (actif / normal / méfiant / à vue-suiveur) × réactions agrégées (geste, leurre, couleur).
   Seuil ≥2 obs par réaction affichée. Montre n obs + n sources pour ne rien survendre. */
function obsEtat(o){
  const b=((o.tags&&o.tags.comportement||'')+' '+(o.text||'')).toLowerCase();
  const has=arr=>arr.some(m=>b.includes(m));
  if(has(['à vue','pêche à vue','visible','repéré','suit','suiveur','poursuite','sans le saisir','sans saisir','sans se piquer','sans s\'engager'])) return 'à vue / suiveur';
  if(has(['méfian','à distance','hésit','peu actif','faible activ','réduite','affaibl','froid','hiver','difficile'])) return 'méfiant';
  if(has(['chasse','actif','agressi','frénési','boil','forte activité','mange bien','attaque franche'])) return 'actif';
  if(has(['pris','capturé','touche','mord','attaque','a saisi','engagé'])) return 'normal';
  return null;
}
function reactGeste(o){
  const a=(o.recommendation&&o.recommendation.animation||'').toLowerCase();
  if(a.includes('dérive')) return 'dérive';
  if(a.includes('lift-and-fall')) return 'lift-and-fall';
  if(['jerk','twitch','shakurri','dart'].some(x=>a.includes(x))) return 'jerks';
  if(['chute','fall','descente'].some(x=>a.includes(x))) return 'chute / fall';
  return null;
}
function reactLeurre(o){
  const l=(o.recommendation&&o.recommendation.lure||'').toLowerCase();
  if(l.includes('shallow')||l.includes('4.0')) return 'egi shallow / lent (4.0)';
  if(l.includes('2.5')) return 'egi 2.5';
  if(l.includes('3.0')) return 'egi 3.0';
  if(l.includes('3.5')) return 'egi 3.5';
  return null;
}
function reactCouleur(o){
  const c=(o.recommendation&&o.recommendation.color||'').toLowerCase();
  if(!c) return null;
  if(['orange','rose','rouge','pink','cherry','vif','contraste','fort'].some(x=>c.includes(x))) return 'contraste / vif';
  if(['clair','naturel','transpar','glow','keimura','uv','nuit','neon','bleu','blue'].some(x=>c.includes(x))) return 'discret / réactif';
  return null;
}
function crossStateReaction(spName){
  const sp=DATA.species.find(s=>s.name_fr===spName); if(!sp) return [];
  const states={};
  speciesObservations(sp.id).forEach(o=>{
    const e=obsEtat(o); if(!e) return;
    if(!states[e]) states[e]={etat:e,n:0,src:new Set(),geste:{},leurre:{},couleur:{}};
    const s=states[e]; s.n++; if(o.source) s.src.add(o.source);
    const bump=(bag,v)=>{ if(v){ bag[v]=(bag[v]||0)+1; } };
    bump(s.geste,reactGeste(o)); bump(s.leurre,reactLeurre(o)); bump(s.couleur,reactCouleur(o));
  });
  const order={'actif':0,'normal':1,'méfiant':2,'à vue / suiveur':3};
  return Object.values(states).sort((a,b)=>(order[a.etat]??9)-(order[b.etat]??9));
}
function crossStateReactionHTML(spName){
  const states=crossStateReaction(spName);

    }).filter(Boolean).join('');

    return `<div class="cross-block">
      <div class="cross-act">${escHTML(s.etat)} <span class="cross-ev ${weak?'is-weak':''}">${s.n} obs · ${s.src.size} source${s.src.size>1?'s':''}${weak?' ⚠':''}</span></div>
      ${lines}</div>`;
  }).filter(Boolean).join('');
  if(!blocks) return '';
  return `<div class="section"><p class="section-title">Selon l'état du poisson</p>
    <div class="ux-section-lead">Ce que les pêcheurs adaptent — geste, leurre, couleur — selon que le calamar est actif, méfiant, ou repéré à vue. Le nombre après chaque réaction = obs concordantes ; ⚠ = une seule source.</div>
    ${blocks}</div>`;

/* Désaccords / consensus : similarité de conditions + similarité de recommandation,
   PAS de correspondance texte exacte. Mots-clés partagés + tags à vocabulaire
   contrôlé identiques comptent comme "conditions proches". */
const COND_DIMS = ["maree","moment_jour","couleur_eau","spot_type","saison"];
const STOPWORDS = new Set(['les','des','une','un','le','la','de','du','pour','dans','sur','avec','par',
  'est','sont','plus','tres','peu','vers','apres','avant','entre','depuis','lorsque','comme','tout',
  'cette','ces','leur','leurs','ils','elle','qui','que','son','ses','sans','pendant','environ','aussi',
  'ainsi','ete','etre','fait','faire','tant','meme','encore','deja','alors','donc','mais','ou','et',
  // domaine : trop génériques pour signaler une vraie similarité de conditions
  'attaque','leurre','poisson','poissons','activite','presence','pris','prise','pecheur','recherche',
  'anime','animee','presente','presentation','recuperation','zone','secteur','session']);

function normWords(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2 && !STOPWORDS.has(w));
}
function jaccard(a,b){
  const A=new Set(normWords(a)), B=new Set(normWords(b));
  if(!A.size||!B.size) return {score:0, inter:0};
  let inter=0; A.forEach(w=>{ if(B.has(w)) inter++; });
  return {score: inter/(A.size+B.size-inter), inter};
}

function conditionMatch(a,b){
  let controlled=0;
  ["maree","moment_jour","couleur_eau"].forEach(d=>{
    if(a.tags[d] && a.tags[d]===b.tags[d]) controlled++;
  });
  const textA = [a.tags.spot_type,a.tags.comportement].filter(Boolean).join(' ');
  const textB = [b.tags.spot_type,b.tags.comportement].filter(Boolean).join(' ');
  const text = jaccard(textA, textB);
  // au moins 2 tags à vocabulaire contrôlé identiques (un seul tag isolé comme
  // "nuit" tout seul ne suffit pas à dire que deux sessions sont comparables),
  // OU au moins 2 mots-clés significatifs partagés sur spot/comportement
  return {controlled, text: text.score, related: controlled>=2 || (text.score>=0.2 && text.inter>=2)};
}

/* Niveau d'activité décrit dans une observation — sert à requalifier les faux désaccords :
   deux recos différentes pour des niveaux d'activité différents = adaptation du pêcheur, pas contradiction */
function activityLevel(o){
  const t = ((o.tags.comportement||'')+' '+(o.text||'')).toLowerCase();
  const low = ['peu actif','faible activité','méfian','sollicit','sans réaction','ne réagi','refus','difficile','poursuite sans','suit sans','calé mais inactif','activité réduite','moins actif'];
  const high = ['forte activité','très actif','chasse','agressi','boil','frénési','activité soutenue','forte concentration','attaques répétées','poissons actifs'];
  const isLow = low.some(k=>t.includes(k)), isHigh = high.some(k=>t.includes(k));
  if(isLow && !isHigh) return 'faible';
  if(isHigh && !isLow) return 'forte';
  return null;
}

/* Typologie d'ACTION — le GESTE réel une fois le leurre à l'eau.
   V5 suit la même grammaire que l'onglet Animation : on ne fusionne plus un one-pitch,
   un lift-and-fall, une chute seule et un linéaire simplement parce qu'ils peuvent tous
   utiliser un jig. Une observation reçoit UNE mécanique dominante, la plus spécifique. */
const ACTION_PATTERNS = [
  {cat:"one-pitch / jigging (canne + moulinet synchronisés)",
   any:["one-pitch","one pitch","fast pitch","remontée rythmée depuis le fond","remonte en one-pitch","ジャカ巻き","pitch jigging"]},
  {cat:"lift-and-fall (lift de canne + retombée)",
   any:["lift-and-fall","lift and fall","soulever le montage","relever puis","décoll","remontées et descentes en laissant le leurre retomber","lift puis fall","lift puis chute"]},
  {cat:"fall / chute (gravité + tension de ligne)",
   any:["free fall","tension fall","カーブフォール","descente en courbe","shimmy fall","back-roll","rolling fall","laisser l'egi retomber","laisser descendre","chute horizontale","laisser tomber","chute contrôlée","10 secondes de chute","allonger le temps de descente","descente stable","descente progressive","sur la chute","pendant la chute"]},
  {cat:"surface — dog-walk / pop / dive (canne + reprise de mou)",
   any:["dog walk","dog-walk","popping","petits pops","popper","plongée sur traction","diving pencil","誘い出し","induction","zigzag de surface"]},
  {cat:"jerk / twitch (impulsion de canne)",
   any:["jerk","twitch","dart","écart latéral","glissade latérale","impulsion de canne","coups de scion","short jerk","long jerk"]},
  {cat:"stop-and-go (moulinet + arrêts)",
   any:["stop-and-go","stop and go","tours de manivelle puis arrêt","tours puis arrêt","récupération puis arrêt","récupérer puis stopper","marquer un arrêt","récupération entrecoupée de pauses"]},
  {cat:"dérive / dead drift (courant + bannière)",
   any:["dériv","dead drift","accompagner le courant","laisser filer","vitesse de dérive","lancer en amont"]},
  {cat:"linéaire (moulinet continu)",
   any:["linéaire","récupération continue","récupération régulière","récupération lente","récupération très lente","dead slow","récupération simple","récupération rapide","tour de manivelle toutes les","digital retrieve","prospection large en récupération"]},
];

/* Renvoie LA catégorie d'action dominante d'une obs (la première règle qui matche, ordre = spécificité),
   ou null si le geste n'est pas décrit. */
function actionCategory(o){
  const rec = o.recommendation || {};
  const blob = ((rec.animation||'') + ' ' + (o.tags && o.tags.comportement || '')).toLowerCase();
  if(!blob.trim()) return null;
  for(const p of ACTION_PATTERNS){
    if(p.any.some(k=>blob.includes(k.toLowerCase()))) return p.cat;
  }
  return null;
}

function findConsensusPairs(obs){
  const recos = technicalObservations(obs).filter(o=>o.recommendation.lure);
  const pairs = [];
  for(let i=0;i<recos.length;i++){
    for(let j=i+1;j<recos.length;j++){
      const a=recos[i], b=recos[j];
      if(a.source===b.source) continue;
      const cond = conditionMatch(a,b);
      if(!cond.related) continue;

      const lureSim = jaccard(a.recommendation.lure, b.recommendation.lure).score;
      const famA = a.recommendation.typology && a.recommendation.typology.famille;
      const famB = b.recommendation.typology && b.recommendation.typology.famille;
      const sameFamille = famA && famB && famA===famB;
      const actA = actionCategory(a), actB = actionCategory(b);
      const sameAction = actA && actB && actA===actB;   // MÊME geste exact, pas un chevauchement flou

      let type, actKind=null, levA=null, levB=null;
      if(lureSim>=0.25 || sameFamille){
        type = evidenceOrigin(a)===evidenceOrigin(b) ? 'recurrence-origin' : 'consensus';
      } else if(sameAction){
        type = evidenceOrigin(a)===evidenceOrigin(b) ? 'recurrence-origin' : 'consensus-action';
        actKind = actA;
      } else {
        levA = activityLevel(a); levB = activityLevel(b);
        if(levA && levB && levA!==levB){ type = 'adaptation'; }
        else { type = 'divergence'; }
      }
      pairs.push({a, b, cond, lureSim, type, actKind, actA, actB, levA, levB});
    }
  }
  const rank = {consensus:0,'consensus-action':1,'recurrence-origin':2,adaptation:3,divergence:4};
  return pairs.sort((p,q)=> (rank[p.type]-rank[q.type]) || ((q.cond.controlled+q.cond.text)-(p.cond.controlled+p.cond.text)));
}

function conditionLabel(pair){
  const bits = [];
  ["maree","moment_jour","couleur_eau"].forEach(d=>{
    if(pair.a.tags[d] && pair.a.tags[d]===pair.b.tags[d]) bits.push(`${DIM_LABELS[d]}: ${pair.a.tags[d]}`);
  });
  if(pair.cond.text >= 0.2) bits.push('conditions similaires (spot/comportement)');
  return bits.join(' · ') || 'conditions proches';
}

function consensusCard(pair){
  const labels = {consensus:'Consensus multi-origines', 'consensus-action':"Consensus d'action multi-origines", 'recurrence-origin':'Récurrence même origine', divergence:'Désaccord', adaptation:"Adaptation à l'activité"};
  const badge = labels[pair.type];
  let note = '';
  if(pair.type==='adaptation'){
    note = `<div class="diverge-conditions" style="color:#7FA8C9">Pas une contradiction : réponses à deux états d'activité (${pair.levA} vs ${pair.levB})</div>`;
  } else if(pair.type==='recurrence-origin'){
    note = `<div class="diverge-conditions" style="color:#8FD3DE">Le signal revient, mais les deux éléments partagent la même plateforme/groupe éditorial : récurrence utile, pas indépendance complète.</div>`;
  } else if(pair.type==='consensus-action'){
    note = `<div class="diverge-conditions" style="color:#5FA87A">Même geste à l'eau — <strong>${pair.actKind}</strong> — avec deux leurres différents. Ce qui compte, c'est l'action, pas le modèle.</div>`;
  }
  const opt = (o,lev) => `<div class="diverge-opt">
    <div class="who">${escHTML(o.source)} · ${escHTML(observationEvidenceType(o))}${lev?` · poissons ${lev}s`:''}</div>
    ${o.recommendation.lure}${o.recommendation.animation?' — '+o.recommendation.animation:''}${o.recommendation.color?' — '+o.recommendation.color:''}
  </div>`;
  return `<div class="consensus-pair is-${pair.type}">
    <span class="consensus-badge is-${pair.type}">${badge}</span>
    <div class="diverge-conditions">${conditionLabel(pair)}</div>
    ${note}
    ${opt(pair.a, pair.type==='adaptation'?pair.levA:null)}${opt(pair.b, pair.type==='adaptation'?pair.levB:null)}
  </div>`;
}

/* ============ QCM ============ */
/* ===================== ARBRE DE DÉCISION — "ça ne mord pas, quoi changer ?" =====================
   Déroule les leviers un par un, dans un ordre adapté aux conditions du moment.
   Sans saisie de config : part de l'espèce + marée + moment actifs. Mémoire de session (leviers épuisés). */

function activeConditions(){
  // récupère marée + moment depuis le QCM en cours si dispo, sinon depuis le port/heure actifs
  const c = {maree:null, moment_jour:null, couleur_eau:null};
  if(qcmState && qcmState.answers){
    c.maree = qcmState.answers.maree || null;
    c.moment_jour = qcmState.answers.moment_jour || null;
    c.couleur_eau = qcmState.answers.couleur_eau || null;
  }
  if(!c.maree){ const ap=getActivePort(); if(ap && typeof tideState==='function'){ try{ c.maree = tideState(ap, new Date()); }catch(e){} } }
  return c;
}

function buildTreeLevers(speciesName){
  const sp = DTREE.species[speciesName];
  if(!sp || !sp.levers) return {levers:[], globalMsg:null, note:null};
  const cond = activeConditions();
  let levers = sp.levers.map(l=>Object.assign({}, l));
  let globalMsg = null;

  // Règles globales : étale => message d'attente ; eau trouble => couleur remonte
  (DTREE.global_rules||[]).forEach(r=>{
    if(r.if==='maree=étale' && cond.maree==='étale') globalMsg = {message:r.message, why:r.why};
    if(r.if==='couleur_eau=trouble' && cond.couleur_eau==='trouble' && r.boost){
      const i = levers.findIndex(l=>l.key===r.boost);
      if(i>0){ const [m]=levers.splice(i,1); levers.unshift(m); m._boosted=r.why; }
    }
  });

  return {levers, globalMsg, note: sp.note||null};
}

function dataThinFor(speciesName){
  // honnêteté : espèces à corpus très mince
  const counts = (DATA.observation_counts)||{};
  const sp = DATA.species.find(s=>s.name_fr===speciesName);
  if(!sp) return false;
  const n = counts[String(sp.id)] || (DATA.observations? DATA.observations.filter(o=>o.species===speciesName).length : 0);
  return n < 6;
}

function startTree(speciesName){
  const {levers, globalMsg, note} = buildTreeLevers(speciesName);
  treeState = {speciesName, levers, idx:0, tried:[], done:false, globalMsg, note, solved:false, solvedLever:null};
  renderTree();
}

function treeNext(){
  if(!treeState) return;
  const cur = treeState.levers[treeState.idx];
  if(cur) treeState.tried.push(cur.key);
  treeState.idx++;
  renderTree();
}
function treeSolved(){
  if(!treeState) return;
  treeState.solved = true;
  treeState.solvedLever = treeState.levers[treeState.idx] || null;
  renderTree();
}
function closeTree(){
  treeState=null; document.body.classList.remove('tree-open');
  const z=document.getElementById('treeZone'); if(!z) return;
  const overlay=z.querySelector('.tree-overlay');
  if(!overlay){ z.innerHTML=''; return; }
  overlay.classList.remove('is-open');
  if(REDUCE_MOTION.matches){ z.innerHTML=''; return; }
  let done=false; const clear=()=>{ if(done) return; done=true; if(!treeState) z.innerHTML=''; };
  overlay.addEventListener('transitionend',clear,{once:true});
  setTimeout(clear,300);
}
function mountTreeCard(cardClass,cardInner){
  const zone=document.getElementById('treeZone'); if(!zone) return;
  let overlay=zone.querySelector('.tree-overlay');
  if(!overlay){
    zone.innerHTML=`<div class="tree-overlay"><div class="tree-card ${cardClass}">${cardInner}</div></div>`;
    overlay=zone.querySelector('.tree-overlay');
    void overlay.offsetWidth;          // force le reflow : sinon l'insertion et is-open
    overlay.classList.add('is-open');  // tombent dans la même frame et rien ne s'anime
  } else {
    const card=overlay.querySelector('.tree-card');
    card.className=`tree-card ${cardClass}`.trim();
    card.innerHTML=cardInner;
    // réouverture pendant la fermeture : le shell est encore là mais masqué
    if(!overlay.classList.contains('is-open')){ void overlay.offsetWidth; overlay.classList.add('is-open'); }
  }
}

function renderTree(){
  const zone = document.getElementById('treeZone');
  if(!zone || !treeState){ if(zone) zone.innerHTML=''; return; }
  document.body.classList.add('tree-open');
  const sp = treeState.speciesName;

  // Cas résolu
  if(treeState.solved){
    const lv = treeState.solvedLever;
    mountTreeCard('is-solved', `
      <div class="tree-badge is-ok">Ça a marché</div>
      <div class="tree-solved-title">Prise sur ${sp} 🎣</div>
      ${lv?`<div class="tree-solved-lever">Levier gagnant : <strong>${DTREE.lever_labels[lv.key]||lv.key}</strong></div>`:''}
      <p class="tree-solved-note">Logger cette prise (config gagnante, spot, conditions) fera d'elle une source terrain — on branchera ça bientôt.</p>
      <div class="tree-actions">
        <button class="tree-btn ghost" onclick="closeTree()">Fermer</button>
        <button class="tree-btn" onclick="(treeState.solved=false,renderTree())">Continuer la pêche</button>
      </div>
    `);
    return;
  }

  // Message global prioritaire (ex. étale) — affiché en tête la première fois
  const globalBlock = (treeState.globalMsg && treeState.idx===0)
    ? `<div class="tree-global"><div class="tree-global-icon">⏸</div><div><div class="tree-global-msg">${treeState.globalMsg.message}</div><div class="tree-why">${treeState.globalMsg.why}</div></div></div>`
    : '';

  // Fin de l'arbre
  if(treeState.idx >= treeState.levers.length){
    mountTreeCard('', `
      <div class="tree-badge">Tous les leviers essayés</div>
      ${globalBlock}
      <p class="tree-end">Tu as parcouru tous les leviers documentés pour le ${sp}. Si rien n'a donné, c'est souvent que le poisson n'est pas là ou pas en activité : change de spot, ou attends la prochaine fenêtre (mouvement d'eau + faible lumière).</p>
      <div class="tree-actions">
        <button class="tree-btn ghost" onclick="closeTree()">Fermer</button>
        <button class="tree-btn" onclick="(treeState.idx=0,treeState.tried=[],renderTree())">↺ Reprendre du début</button>
      </div>
    `);
    return;
  }

  const lv = treeState.levers[treeState.idx];
  const cond = activeConditions();
  const condLine = [sp, cond.maree&&('marée '+cond.maree), cond.moment_jour].filter(Boolean).join(' · ');
  const thin = dataThinFor(sp);
  const stepNum = treeState.idx+1, total = treeState.levers.length;
  const triedChips = treeState.tried.length
    ? `<div class="tree-tried">Déjà essayé : ${treeState.tried.map(k=>`<span class="tree-tried-chip">${DTREE.lever_labels[k]||k}</span>`).join('')}</div>` : '';

  mountTreeCard('', `
    <button class="tree-close" onclick="closeTree()" aria-label="Fermer">×</button>
    <div class="tree-cond">${condLine}</div>
    ${globalBlock}
    ${thin?`<div class="tree-thin">⚠ Peu de données terrain sur cette espèce — ces leviers sont des repères généraux, à confirmer sur place.</div>`:''}
    <div class="tree-step">Levier ${stepNum}/${total}</div>
    <div class="tree-lever-name">${DTREE.lever_labels[lv.key]||lv.key}${lv._boosted?' <span class="tree-boost">↑ eau trouble</span>':''}</div>
    <div class="tree-action">${lv.action}</div>
    <div class="tree-why">${lv._boosted||lv.why}</div>
    <div class="tree-actions">
      <button class="tree-btn ghost" onclick="treeNext()">Fait, toujours rien →</button>
      <button class="tree-btn ok" onclick="treeSolved()">Ça a marché !</button>
    </div>
    ${triedChips}
  `);
}

function startQCM(){ qcmState = {step:0, answers:{}}; renderQCM(); }

function renderQCM(){
  const zone = document.getElementById('qcmZone');
  if(!qcmState){ zone.innerHTML=''; return; }
  if(qcmState.step >= QCM_STEPS.length){ renderQCMResults(); return; }

  const step = QCM_STEPS[qcmState.step];
  let suggestion = null, note = '';

  if(step.tide){
    const ap = getActivePort();
    if(ap && PORTS[ap]){
      suggestion = tideState(ap, new Date());
      note = suggestion ? `<div class="qcm-auto">JMA embarqué — ${PORTS[ap].label}, maintenant. Tape une autre option pour corriger.</div>` : `<div class="qcm-auto">Pas de table JMA embarquée pour aujourd’hui — choisis manuellement.</div>`;
    } else {
      note = `<div class="qcm-auto">Astuce : active un port depuis "Où je pêche" pour utiliser la table JMA embarquée quand la date est couverte.</div>`;
    }
  }

  if(step.multi){
    const sel = qcmState.obsSel || [];
    zone.innerHTML = `<div class="qcm-panel">
      <div class="qcm-step-label">Étape ${qcmState.step+1} / ${QCM_STEPS.length} — lecture du spot</div>
      <p class="qcm-question">${step.question}</p>
      <div class="obs-chips">
        ${step.options.map(o=>`<button class="obs-chip ${sel.includes(o)?'on':''}" onclick="toggleObsChip('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
      <button class="qcm-cta" style="margin-top:14px" onclick="validateObs()">${sel.length?`Valider (${sel.length} indice${sel.length>1?'s':''}) →`:'Rien de notable → résultats'}</button>
    </div>`;
    return;
  }

  zone.innerHTML = `<div class="qcm-panel">
    <div class="qcm-step-label">Étape ${qcmState.step+1} / ${QCM_STEPS.length}</div>
    <p class="qcm-question">${step.question}</p>
    <div class="qcm-options">
      ${step.options.map(o=>`<button class="qcm-opt ${o===suggestion?'suggested':''}" onclick="selectQCMAnswer('${step.dim}','${o}')">${o}</button>`).join('')}
    </div>
    ${note}
  </div>`;

}

function toggleObsChip(cat){
  if(!qcmState) return;
  qcmState.obsSel = qcmState.obsSel || [];
  const i = qcmState.obsSel.indexOf(cat);
  if(i>=0) qcmState.obsSel.splice(i,1); else qcmState.obsSel.push(cat);
  renderQCM();
}
function validateObs(){
  if(!qcmState) return;
  qcmState.answers.observation = qcmState.obsSel || [];
  qcmState.step += 1;
  renderQCM();
}

function selectQCMAnswer(dim, value, expectedStep=null){
  if(!qcmState) return;
  if(expectedStep!==null && qcmState.step!==expectedStep) return;
  const step=QCM_STEPS[qcmState.step];
  if(!step || step.dim!==dim) return;
  qcmState.answers[dim] = String(value).toLowerCase();
  qcmState.step += 1;
  renderQCM();
}

function qcmColorGuideHTML(sp,answers){
  const water=answers.couleur_eau, light=answers.moment_jour, seen=answers.observation||[];
  const bait=seen.includes('fourrage visible / oiseaux');
  const transition=light==='aube'||light==='crépuscule', night=light==='nuit';
  let start='', alt='';
  if(night){
    if(water==='claire'){
      start='sous éclairage : naturel/transparent; sans éclairage : silhouette sombre ou pearl/white';
      alt='glow ponctuel si cohérent avec la technique, sans confondre glow et fluorescence UV';
    }else{
      start='opaque pearl/white ou silhouette sombre bien lisible';
      alt='chart/rose en accent ou glow ponctuel; réduire le signal si suivis sans attaque';
    }
  }else if(water==='claire'){
    start=transition?'translucide/pearl ou naturel avec contraste contenu':'ghost / transparent / naturel bait';
    alt=transition?'accent rose/chart fluorescent ou UV-reactif, puis réduire quand la lumière monte':'un peu de flash si activité; plus opaque si ciel se ferme';
  }else if(water==='verte'){
    start=transition?'pearl + rose/magenta ou chartreuse bien lisible':'silver/gold naturel + accent rose ou chart';
    alt=transition?'rose = contraste de teinte; chart = lisibilité. Tester les deux niveaux de signal.':'naturel/flash si chasse sur bait; plus discret si pression forte';
  }else if(water==='trouble'){
    start=transition?'opaque pearl/blanc, chartreuse/jaune ou rose/orange high-appeal':'opaque/pearl + flash ou chartreuse';
    alt='garder une option sombre/mate pour une silhouette franche si le flash ne produit rien';
  }else{
    start=transition?'opaque/pearl ou accent fluo/UV avec une option naturelle':'naturel/ghost comme base';
    alt='bracketer avec une option plus discrète et une plus visible';
  }
  const baitLine=bait?'Fourrage visible : fais d’abord matcher silhouette/taille, couche et cadence; la nuance exacte vient après. ':'';
  return `<div class="essence-box" style="margin:10px 0"><strong>Couleur — point de départ</strong> <span style="color:var(--text-muted);font-size:0.6875rem">(aide de décision)</span><br>${escHTML(baitLine)}Départ : <strong>${escHTML(start)}</strong>. Alternative : ${escHTML(alt)}.</div>`;
}

function renderQCMResults(){
  const obs = technicalObservations(speciesObservations(currentSpeciesId));
  const answers = qcmState.answers;
  const obsSel = answers.observation || [];
  const scored = obs.map(o=>{
    const matchedDims = [];
    Object.entries(answers).forEach(([d,v])=>{
      if(d==='observation') return;
      if(o.tags[d] && o.tags[d].toLowerCase()===v) matchedDims.push(`${DIM_LABELS[d]||d}: ${v}`);
    });
    const matchedObs = obsMatchCategories(o, obsSel);
    return {o, matchedDims, matchedObs, matches: matchedDims.length + matchedObs.length};
  }).filter(r=>r.matches>0).sort((a,b)=> b.matches-a.matches || evidenceRecommendationScore(b.o)-evidenceRecommendationScore(a.o));

  const zone = document.getElementById('qcmZone');
  const condBits = Object.entries(answers).filter(([d])=>d!=='observation').map(([d,v])=>`${DIM_LABELS[d]||d}=${v}`);
  if(obsSel.length) condBits.push(`lecture: ${obsSel.join(' + ')}`);
  const condLine = condBits.join(' · ');
  if(!scored.length){
    zone.innerHTML = `<div class="qcm-panel">
      <div class="qcm-step-label">${condLine}</div>
      ${qcmColorGuideHTML(DATA.species.find(s=>s.id===currentSpeciesId),answers)}
      <div class="empty">Pas de recommandation sourcée pour cette combinaison.<br>Réfère-toi au top leurres — et logge ta session : elle deviendra la première source terrain pour ces conditions.</div>
      <span class="restart-btn" onclick="startQCM()">↺ Refaire</span></div>`;
    return;
  }
  zone.innerHTML = `<div class="qcm-panel">
    <p class="qcm-step-label">${condLine}</p>
    ${qcmColorGuideHTML(DATA.species.find(s=>s.id===currentSpeciesId),answers)}
    ${scored.map(({o,matchedDims,matchedObs})=>`
      <div class="reco-card">
        ${gearBadgeHTML(DATA.species.find(s=>s.id===currentSpeciesId),o)}
        <div class="reco-lure">${escHTML(o.recommendation.lure||'Config')}</div>
        ${typoBadge(o)}
        <div class="match-chips">
          ${matchedObs.map(c=>`<span class="match-chip is-spot">👁 ${c}</span>`).join('')}
          ${matchedDims.map(c=>`<span class="match-chip">${c}</span>`).join('')}
        </div>
        ${o.recommendation.color?`<div class="reco-row"><span class="k">Couleur</span>${escHTML(o.recommendation.color)}</div>`:''}
        ${o.recommendation.animation?`<div class="reco-row"><span class="k">Animation</span>${escHTML(o.recommendation.animation)}</div>`:''}
        ${o.recommendation.leader?`<div class="reco-row"><span class="k">Bas de ligne</span>${escHTML(o.recommendation.leader)}</div>`:''}
        <div class="reco-proofline"><span class="context-fit">Compatibilité conditions : ${matchedDims.length+matchedObs.length}/${Object.keys(answers).filter(k=>k!=='observation').length+(answers.observation||[]).length||1}</span>${evidenceMiniHTML(DATA.species.find(s=>s.id===currentSpeciesId),o,'lure')}</div>${(()=>{const spx=DATA.species.find(s=>s.id===currentSpeciesId),k=evidenceKey(o,'lure'),g=k?evidenceGroup(spx.id,'lure',k):null;return g?evidenceDetailsHTML(g):'';})()}<div class="reco-source">${escHTML(o.source)} (${escHTML(o.source_type)}) · ${escHTML(observationEvidenceType(o))}</div>
      </div>`).join('')}
    <span class="restart-btn" onclick="startQCM()">↺ Refaire</span></div>`;
}

/* ============ LOG TERRAIN ============ */
function logFormHTML(sp){
  const last = qcmState && qcmState.answers ? qcmState.answers : {};
  const condNote = Object.keys(last).length
    ? `Conditions reprises du QCM : ${Object.entries(last).map(([d,v])=>`${DIM_LABELS[d]||d}=${Array.isArray(v)?v.join(' + '):v}`).join(' · ')}`
    : 'Fais le QCM d\u2019abord pour capturer les conditions automatiquement (sinon la session part sans conditions).';
  return `<div class="log-form">
    <label>Leurre utilisé</label>
    <input id="logLure" placeholder="ex: sinking pencil 28 g, iwashi">
    <label>Combo utilisé</label>
    <select id="logCombo">${['M','MH'].map(code=>`<option value="${code}" ${gearPlanFor(sp.name_fr,null).code===code?'selected':''}>${code} · ${escHTML((gearSetup(code)?.setup?.rod?.model)||code)} · PE${escHTML(gearSetup(code)?.setup?.line?.size||'')}</option>`).join('')}</select>
    <label>Poids total lancé (g) · optionnel</label>
    <input id="logWeight" type="number" inputmode="decimal" min="0" max="50" step="0.5" placeholder="poids leurre + montage">
    <label>Résultat</label>
    <div class="row3">
      <button onclick="setLogResult(this,'prise')">Prise</button>
      <button onclick="setLogResult(this,'suivi')">Suivi/raté</button>
      <button onclick="setLogResult(this,'rien')">Rien</button>
    </div>
    <label>Notes (taille, comportement, spot précis…)</label>
    <textarea id="logNotes" rows="2"></textarea>
    <div class="qcm-auto" style="margin-top:8px">${condNote}</div>
    <button class="log-save" onclick="saveLog('${sp.name_fr}')">Enregistrer la session</button>
    <div class="log-count">${getSessions().length} session(s) en mémoire locale</div>
  </div>`;
}

function setLogResult(btn, val){
  logResult = val;
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function saveLog(speciesName){
  const lure = document.getElementById('logLure').value.trim();
  const combo = document.getElementById('logCombo').value;
  const rawWeight=document.getElementById('logWeight').value;
  const castWeight=rawWeight===''?null:Number(rawWeight);
  if(!lure || !logResult){ alert('Leurre + résultat obligatoires.'); return; }
  if(castWeight!==null && (!Number.isFinite(castWeight)||castWeight>maxLureWeight())){ alert(`Plafond projet : ${maxLureWeight()} g maximum.`); return; }
  const sessions = getSessions();
  const now=new Date(), jp=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(now).replace('T',' ');
  sessions.push({
    date: jp,
    timezone: 'Asia/Tokyo',
    created_at_utc: now.toISOString(),
    species: speciesName.toLowerCase(),
    conditions: JSON.parse(JSON.stringify((qcmState && qcmState.answers) ? qcmState.answers : {})),
    port: getActivePort() || null,
    lure, combo, cast_weight_g: castWeight, result: logResult,
    notes: document.getElementById('logNotes').value.trim(),
  });
  if(!saveSessions(sessions)){ alert('Impossible d’enregistrer la session sur cet appareil. Vérifie que le stockage local est autorisé ou libère de l’espace. Le formulaire est conservé.'); return; }
  logResult = null;
  const sp = DATA.species.find(s=>s.id===currentSpeciesId);
  document.getElementById('logZone').innerHTML = logFormHTML(sp);
}

function exportSessions(){
  const data = JSON.stringify(getSessions(), null, 2);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
  a.download = 'sessions-terrain.json';
  a.click();
}

window.addEventListener('resize', syncStickyHeaderOffset, {passive:true});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// Filet de sécurité : jamais d'écran blanc muet. Si le démarrage plante ou traîne, on affiche un message + reset.
function showFatal(msg){
  document.getElementById('mainZone').innerHTML =
    '<div style="padding:24px;font-family:sans-serif;color:#ddd">'
    + '<h3 style="color:#00AE74">Chargement impossible</h3>'
    + '<p style="opacity:.8;font-size:0.875rem">'+escHTML(msg||'')+'</p>'
    + '<button onclick="resetApp()" style="margin-top:12px;padding:12px 16px;background:#00AE74;border:none;border-radius:8px;font-weight:600">Vider le cache et recharger</button>'
    + '</div>';
}
function resetApp(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistration().then(r=>r&&r.unregister()); }
  if(window.caches){ caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('carnet-peche-jp-')).map(k=>caches.delete(k)))).then(()=>location.reload(true)); }
  else location.reload(true);
}
window.addEventListener('error', (e)=>{
  if(!document.getElementById('mainZone').innerHTML.trim()) showFatal(e.message);
});
const _bootTimer = setTimeout(()=>{
  if(!document.getElementById('mainZone').innerHTML.trim()) showFatal('Délai dépassé au chargement des données.');
}, 6000);

restoreUXState();
installSwipeNavigation();
installTideScrub();
function trapUXSheetFocus(e){
  const back=document.getElementById('uxBackdrop'),sheet=document.getElementById('uxSheet');
  if(e.key!=='Tab'||!back?.classList.contains('open')||!sheet)return;
  const focusable=[...sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.getClientRects().length);
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
document.addEventListener('keydown',e=>{
  const back=document.getElementById('uxBackdrop');
  if(e.key==='Escape'&&back?.classList.contains('open')){e.preventDefault();closeUXSheet();return;}
  trapUXSheetFocus(e);
});

(async ()=>{
  try{ await loadData(); }
  catch(e){ showFatal(e.message); }
  finally{ clearTimeout(_bootTimer); }
})();
</script>
